<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  height:100%;
  overflow-x:hidden;
  background:#0b1220;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

/* фикс док бара */
.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  padding-bottom:env(safe-area-inset-bottom);
  backdrop-filter:blur(20px);
  background:rgba(20,24,40,.6);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;
  justify-content:space-around;
  padding-top:12px;
  padding-bottom:12px;
  z-index:1000;
}

/* чтобы контент не резался */
.content{
  padding-bottom:110px;
}

/* glow эффект */
.glow{
  box-shadow:0 0 40px rgba(140,100,255,.4);
}

/* кнопка анимация */
.button{
  background:linear-gradient(90deg,#7c5cff,#b28dff);
  border:none;
  border-radius:18px;
  padding:18px;
  color:#fff;
  font-weight:600;
  font-size:18px;
  width:100%;
  transition:.2s;
}

.button:active{
  transform:scale(.97);
  box-shadow:0 0 30px rgba(150,120,255,.8);
}

</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AURA</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  background:#070b14;
  color:white;
  overflow-x:hidden;
}

/* ================= HERO ================= */

.hero{
  position:relative;
  height:340px;
  width:100%;
  background:url("./assets/IMG_1348.jpeg") center/cover no-repeat;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,
    rgba(7,11,20,0) 0%,
    rgba(7,11,20,0.8) 70%,
    #070b14 100%);
}

/* ================= CONTENT ================= */

.content{
  padding:20px;
  margin-top:-120px;
  position:relative;
  z-index:2;
}

h1{
  font-size:36px;
  font-weight:700;
}

.subtitle{
  opacity:0.6;
  margin-top:6px;
}

/* ================= STATUS ================= */

.status{
  margin-top:16px;
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:10px 16px;
  border-radius:30px;
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
}

.dot{
  width:10px;
  height:10px;
  background:#00ff88;
  border-radius:50%;
  box-shadow:0 0 12px #00ff88;
}

/* ================= CARDS ================= */

.cards{
  display:flex;
  gap:16px;
  margin-top:24px;
}

.card{
  flex:1;
  padding:20px;
  border-radius:24px;
  backdrop-filter:blur(30px);
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-6px);
}

.iconBox{
  width:70px;
  height:70px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:14px;
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,0.08);
  box-shadow:0 0 25px rgba(140,90,255,0.4);
}

.iconBox img{
  width:28px;
  opacity:0.9;
}

.card h3{
  font-size:18px;
  margin-bottom:6px;
}

.card p{
  font-size:13px;
  opacity:0.6;
}

/* ================= AI BLOCK ================= */

.ai{
  margin-top:28px;
  padding:22px;
  border-radius:24px;
  backdrop-filter:blur(30px);
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
}

.input{
  margin-top:14px;
  padding:14px;
  border-radius:18px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  color:white;
  width:100%;
  outline:none;
}

.button{
  margin-top:18px;
  width:100%;
  padding:16px;
  border:none;
  border-radius:30px;
  font-size:16px;
  font-weight:600;
  color:white;
  background:linear-gradient(90deg,#6c4dff,#b07cff);
  box-shadow:0 0 40px rgba(150,100,255,0.7);
  cursor:pointer;
  transition:0.3s;
}

.button:hover{
  transform:scale(1.04);
  box-shadow:0 0 60px rgba(150,100,255,1);
}

.button:active{
  transform:scale(0.96);
}

/* ================= TABBAR ================= */

.tabbar{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  height:70px;
  border-radius:40px;
  backdrop-filter:blur(30px);
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.tab{
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:12px;
  opacity:0.6;
}

.tab img{
  width:24px;
  margin-bottom:4px;
}

.tab.active{
  opacity:1;
  color:#c8a6ff;
}

.tab.active img{
  filter:drop-shadow(0 0 10px #9f6bff);
}
</style>
</head>

<body>

<div class="hero"></div>

<div class="content">

<h1>Мой дом</h1>
<div class="subtitle">Пока нет устройств</div>

<div class="status">
<div class="dot"></div>
Всё спокойно
</div>

<div class="cards">

<div class="card">
<div class="iconBox">
<img src="./assets/icons/home.svg">
</div>
<h3>Устройства с Алисой</h3>
<p>Яндекс, Xiaomi, JBL и другие</p>
</div>

<div class="card">
<div class="iconBox">
<img src="./assets/icons/catalog.svg">
</div>
<h3>Устройства умного дома</h3>
<p>Свет, розетки, телевизор</p>
</div>

</div>

<div class="ai">
<h3>ИИ-команда для Алисы</h3>
<input class="input" placeholder="Например: включи свет в гостиной на 30%">
<button class="button">Сформировать команду</button>
</div>

</div>

<div class="tabbar">

<div class="tab active">
<img src="./assets/icons/home.svg">
Мой дом
</div>

<div class="tab">
<img src="./assets/icons/scenes.svg">
Сценарии
</div>

<div class="tab">
<img src="./assets/icons/catalog.svg">
Каталог
</div>

<div class="tab">
<img src="./assets/icons/tips.svg">
Советы
</div>

</div>

</body>
</html>
