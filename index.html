<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>AURA</title>

<style>
:root{
  --bg:#0c0f1a;
  --glass:rgba(255,255,255,.06);
  --stroke:rgba(255,255,255,.12);
  --text:#f5f7ff;
  --muted:rgba(255,255,255,.55);
  --accent1:#7c5cff;
  --accent2:#a88bff;
  --good:#27ff9f;
  --danger:#ff5f7f;
  --radius:28px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui;
  background:radial-gradient(1200px 600px at 50% -200px,#1a1f38 0%,#0c0f1a 60%);
  color:var(--text);
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

/* HERO */
.hero{
  height:340px;
  background:url("./assets/IMG_1348.jpeg") center/cover no-repeat;
  position:relative;
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(12,15,26,.1) 0%,rgba(12,15,26,.9) 100%);
}

/* CONTENT */
.content{
  margin-top:-160px;
  padding:0 18px 130px;
  animation:fadeIn .6s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px)}
  to{opacity:1; transform:translateY(0)}
}

.title{
  font-size:52px;
  font-weight:900;
  margin-bottom:6px;
  letter-spacing:-1px;
}

.subtitle{
  color:var(--muted);
  margin-bottom:18px;
}

.status{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 18px;
  border-radius:999px;
  background:var(--glass);
  backdrop-filter:blur(25px);
  border:1px solid var(--stroke);
  margin-bottom:18px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--good);
  box-shadow:0 0 14px var(--good);
}

/* GLASS PANEL */
.panel{
  background:var(--glass);
  backdrop-filter:blur(30px);
  border:1px solid var(--stroke);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 30px 80px rgba(0,0,0,.5);
  transition:transform .2s ease;
}
.panel:active{
  transform:scale(.98);
}

/* COMFORT */
.bar{
  height:12px;
  border-radius:999px;
  background:rgba(255,255,255,.1);
  overflow:hidden;
  margin-top:8px;
}
.fill{
  height:100%;
  width:82%;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  transition:width .4s ease;
}

/* DEVICES */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.card{
  padding:18px;
  border-radius:var(--radius);
  background:var(--glass);
  border:1px solid var(--stroke);
  backdrop-filter:blur(25px);
  text-align:center;
  transition:all .2s ease;
}
.card:active{
  transform:scale(.97);
}

/* SWITCH */
.switch{
  margin:12px auto 0;
  width:50px;
  height:28px;
  border-radius:999px;
  background:rgba(255,255,255,.2);
  position:relative;
  transition:.3s;
}
.switch::after{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  border-radius:50%;
  background:white;
  top:3px;
  left:3px;
  transition:.3s;
}
.switch.on{
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
}
.switch.on::after{
  left:25px;
}

/* MOODS */
.moods{
  display:flex;
  gap:10px;
  overflow:auto;
  margin-bottom:18px;
}
.mood{
  padding:10px 16px;
  border-radius:999px;
  background:var(--glass);
  border:1px solid var(--stroke);
  backdrop-filter:blur(20px);
  cursor:pointer;
  white-space:nowrap;
  transition:.3s;
}
.mood.active{
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
}

/* AI */
.ai-input{
  width:100%;
  height:50px;
  border-radius:18px;
  border:1px solid var(--stroke);
  background:rgba(255,255,255,.08);
  padding:0 14px;
  color:white;
}
.btn{
  margin-top:12px;
  width:100%;
  height:56px;
  border:none;
  border-radius:22px;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:white;
  font-weight:800;
  font-size:18px;
  transition:.2s;
}
.btn:active{
  transform:scale(.97);
}

/* TAB BAR */
.tabbar{
  position:fixed;
  bottom:14px;
  left:14px;
  right:14px;
  height:80px;
  border-radius:32px;
  background:rgba(20,22,35,.7);
  backdrop-filter:blur(30px);
  border:1px solid var(--stroke);
  display:flex;
  justify-content:space-around;
  align-items:center;
}
.tab{
  font-size:12px;
  color:var(--muted);
}
.tab.active{
  color:white;
}
</style>
</head>

<body>

<div class="hero"></div>

<div class="content">

<div class="title">Дом</div>
<div class="subtitle">Digital Soul</div>

<div class="status">
  <div class="dot"></div>
  Всё спокойно
</div>

<div class="panel">
  <div>Индекс комфорта: <strong id="comfortVal">82%</strong></div>
  <div class="bar"><div class="fill" id="comfortBar"></div></div>
</div>

<div class="moods">
  <div class="mood active">Уют</div>
  <div class="mood">Фокус</div>
  <div class="mood">Энергия</div>
  <div class="mood">Спокойствие</div>
</div>

<div class="grid">
  <div class="card">
    Свет
    <div class="switch on"></div>
  </div>
  <div class="card">
    ТВ
    <div class="switch"></div>
  </div>
</div>

<div class="panel">
  <div style="margin-bottom:10px;font-weight:800;">AI Центр</div>
  <input class="ai-input" placeholder="Сделай уютно"/>
  <button class="btn">Выполнить</button>
</div>

</div>

<div class="tabbar">
  <div class="tab active">Дом</div>
  <div class="tab">Сцены</div>
  <div class="tab">Профиль</div>
  <div class="tab">AI</div>
</div>

<script>
const switches=document.querySelectorAll(".switch");
const comfortBar=document.getElementById("comfortBar");
const comfortVal=document.getElementById("comfortVal");

switches.forEach(sw=>{
  sw.onclick=()=>{
    sw.classList.toggle("on");
    updateComfort();
  }
});

document.querySelectorAll(".mood").forEach(m=>{
  m.onclick=()=>{
    document.querySelectorAll(".mood").forEach(x=>x.classList.remove("active"));
    m.classList.add("active");
    updateComfort();
  }
});

function updateComfort(){
  const val=Math.floor(Math.random()*20)+75;
  comfortVal.innerText=val+"%";
  comfortBar.style.width=val+"%";
}
</script>

</body>
</html>
