<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>AURA</title>

<style>
:root{
  --bg:#0b1220;
  --panel:rgba(18,22,36,.6);
  --stroke:rgba(255,255,255,.10);
  --text:#eef2ff;
  --muted:rgba(255,255,255,.55);
  --accent:#8b5cff;
  --accent2:#b9a6ff;
  --good:#1aff8c;
  --warn:#ffd166;
  --danger:#ff5e7e;
  --radius:24px;
  --shadow:0 20px 60px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}

.hero{
  height:320px;
  background:url("./assets/IMG_1348.jpeg") center/cover no-repeat;
  position:relative;
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(11,18,32,.1) 0%,rgba(11,18,32,.9) 100%);
}

.content{
  margin-top:-140px;
  padding:0 16px 120px;
}

.title{
  font-size:44px;
  font-weight:900;
  margin-bottom:6px;
}

.subtitle{
  color:var(--muted);
  margin-bottom:16px;
}

.status{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 16px;
  border-radius:999px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--stroke);
  margin-bottom:14px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--good);
  box-shadow:0 0 12px var(--good);
}

.panel{
  background:var(--panel);
  border:1px solid var(--stroke);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow);
}

.panel h3{
  margin:0 0 10px;
}

.bar{
  height:10px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  overflow:hidden;
}

.fill{
  height:100%;
  width:80%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .4s ease;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.card{
  padding:14px;
  border-radius:var(--radius);
  border:1px solid var(--stroke);
  background:rgba(255,255,255,.05);
}

.switch{
  width:42px;
  height:24px;
  border-radius:999px;
  background:rgba(255,255,255,.2);
  position:relative;
  cursor:pointer;
}
.switch::after{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  border-radius:50%;
  background:white;
  top:3px;
  left:3px;
  transition:.2s;
}
.switch.on{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
}
.switch.on::after{
  left:21px;
}

.moods{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:14px;
}
.mood{
  padding:8px 14px;
  border-radius:999px;
  border:1px solid var(--stroke);
  background:rgba(255,255,255,.05);
  cursor:pointer;
}
.mood.active{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
}

.ai-input{
  width:100%;
  height:44px;
  border-radius:14px;
  border:1px solid var(--stroke);
  background:rgba(255,255,255,.06);
  padding:0 12px;
  color:white;
}

.btn{
  margin-top:8px;
  width:100%;
  height:48px;
  border:none;
  border-radius:16px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:white;
  font-weight:800;
  cursor:pointer;
}
.btn:active{
  transform:scale(.98);
}

.tabbar{
  position:fixed;
  bottom:10px;
  left:10px;
  right:10px;
  height:70px;
  border-radius:20px;
  background:rgba(20,22,35,.7);
  border:1px solid var(--stroke);
  backdrop-filter:blur(20px);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.tab{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  cursor:pointer;
}
.tab.active{
  color:white;
}
</style>
</head>

<body>

<div class="hero"></div>

<div class="content">

<div class="title">Дом</div>
<div class="subtitle">Цифровая душа вашего дома</div>

<div class="status">
  <div class="dot"></div>
  Всё спокойно
</div>

<div class="panel">
  <h3>Индекс комфорта: <span id="comfortVal">82</span>%</h3>
  <div class="bar"><div class="fill" id="comfortBar"></div></div>
</div>

<div class="moods">
  <div class="mood active">Уют</div>
  <div class="mood">Фокус</div>
  <div class="mood">Энергия</div>
  <div class="mood">Спокойствие</div>
</div>

<div class="grid">
  <div class="card">
    Свет
    <div class="switch on"></div>
  </div>
  <div class="card">
    Телевизор
    <div class="switch"></div>
  </div>
</div>

<div class="panel">
  <h3>AI Центр</h3>
  <input class="ai-input" placeholder="Например: сделай уютно"/>
  <button class="btn">Сформировать</button>
</div>

</div>

<div class="tabbar">
  <div class="tab active">Дом</div>
  <div class="tab">Сцены</div>
  <div class="tab">Профиль</div>
  <div class="tab">AI</div>
</div>

<script>
const comfortBar=document.getElementById("comfortBar");
const comfortVal=document.getElementById("comfortVal");

document.querySelectorAll(".switch").forEach(sw=>{
  sw.onclick=()=>{
    sw.classList.toggle("on");
    updateComfort();
  }
});

document.querySelectorAll(".mood").forEach(m=>{
  m.onclick=()=>{
    document.querySelectorAll(".mood").forEach(x=>x.classList.remove("active"));
    m.classList.add("active");
    updateComfort();
  }
});

function updateComfort(){
  const val=Math.floor(Math.random()*20)+75;
  comfortVal.innerText=val;
  comfortBar.style.width=val+"%";
}
</script>

</body>
</html>
