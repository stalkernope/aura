<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AURA</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

body{
  background:#0b0f18;
  color:white;
  overflow-x:hidden;
}

/* HERO */

.hero{
  position:relative;
  height:330px;
  width:100%;
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:url("./assets/hero.jpg") center/cover no-repeat;
  transform:scale(1.05);
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom, rgba(11,15,24,0) 40%, #0b0f18 95%);
}

/* QUICK BUTTONS */

.quickRow{
  position:absolute;
  bottom:110px;
  left:20px;
  display:flex;
  gap:12px;
}

.quickBtn{
  width:70px;
  height:70px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.1);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:0.3s;
}

.quickBtn img{
  width:28px;
  opacity:0.9;
}

.quickBtn:hover{
  box-shadow:0 0 25px rgba(140,92,255,0.6);
}

/* CONTENT */

.container{
  padding:20px;
  margin-top:-80px;
}

h1{
  font-size:36px;
  font-weight:700;
  margin-bottom:6px;
}

.sub{
  opacity:0.6;
  margin-bottom:15px;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:20px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  margin-bottom:25px;
}

.statusDot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#2cff8f;
  box-shadow:0 0 10px #2cff8f;
}

/* CARDS */

.cardRow{
  display:flex;
  gap:15px;
}

.card{
  flex:1;
  padding:20px;
  border-radius:25px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  transition:0.3s;
}

.card:hover{
  box-shadow:0 0 40px rgba(140,92,255,0.4);
}

.cardIcon{
  width:70px;
  height:70px;
  border-radius:20px;
  background:rgba(255,255,255,0.08);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:15px;
}

.cardIcon img{
  width:32px;
}

.card h3{
  margin-bottom:8px;
}

.card p{
  opacity:0.6;
  font-size:14px;
}

/* AI BLOCK */

.aiBlock{
  margin-top:25px;
  padding:20px;
  border-radius:30px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
}

.aiInput{
  width:100%;
  padding:14px;
  border-radius:20px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.06);
  color:white;
  margin:15px 0;
}

.aiBtn{
  width:100%;
  padding:16px;
  border-radius:25px;
  border:none;
  font-size:16px;
  font-weight:600;
  color:white;
  cursor:pointer;
  background:linear-gradient(135deg,#7a5cff,#b57cff);
  transition:0.3s;
}

.aiBtn:hover{
  box-shadow:0 0 40px rgba(140,92,255,0.7);
  transform:translateY(-2px);
}

/* BOTTOM NAV */

.bottomNav{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  height:75px;
  border-radius:35px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.navItem{
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:12px;
  opacity:0.6;
}

.navItem img{
  width:24px;
  margin-bottom:4px;
}

.navItem.active{
  opacity:1;
}

</style>
</head>

<body>

<div class="hero">
  <div class="quickRow">
    <div class="quickBtn"><img src="./assets/icons/home.svg"/></div>
    <div class="quickBtn"><img src="./assets/icons/search.svg"/></div>
    <div class="quickBtn"><img src="./assets/icons/gear.svg"/></div>
  </div>
</div>

<div class="container">
  <h1>Мой дом</h1>
  <div class="sub">Пока нет устройств</div>

  <div class="status">
    <div class="statusDot"></div>
    Всё спокойно
  </div>

  <div class="cardRow">
    <div class="card">
      <div class="cardIcon">
        <img src="./assets/icons/home.svg"/>
      </div>
      <h3>Устройства с Алисой</h3>
      <p>Яндекс, Xiaomi, JBL и другие</p>
    </div>

    <div class="card">
      <div class="cardIcon">
        <img src="./assets/icons/catalog.svg"/>
      </div>
      <h3>Устройства умного дома</h3>
      <p>Свет, розетки, телевизор</p>
    </div>
  </div>

  <div class="aiBlock">
    <h3>ИИ-команда для Алисы</h3>
    <input class="aiInput" placeholder="Например: включи свет в гостиной на 30%"/>
    <button class="aiBtn">Сформировать команду</button>
  </div>

</div>

<div class="bottomNav">
  <div class="navItem active">
    <img src="./assets/icons/home.svg"/>
    Мой дом
  </div>
  <div class="navItem">
    <img src="./assets/icons/scenes.svg"/>
    Сценарии
  </div>
  <div class="navItem">
    <img src="./assets/icons/catalog.svg"/>
    Каталог
  </div>
  <div class="navItem">
    <img src="./assets/icons/tips.svg"/>
    Советы
  </div>
</div>

</body>
</html>
