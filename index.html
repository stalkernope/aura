<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AURA X</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root{
      --bg0:#06070b;
      --bg1:#0b0f18;
      --card:#141a24cc;
      --card2:#1a2230cc;
      --stroke:rgba(255,255,255,.06);
      --text:#f2f4ff;
      --muted:#96a0b5;
      --good:#34C759;
      --bad:#8892a5;
      --a1:#7B61FF;
      --a2:#5E8BFF;
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --radius: 22px;
      --r2: 18px;
      --navH: 86px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial;
      background:
        radial-gradient(80% 60% at 70% 10%, rgba(94,139,255,.18), transparent 60%),
        radial-gradient(70% 50% at 10% 20%, rgba(123,97,255,.16), transparent 55%),
        linear-gradient(180deg,var(--bg1),var(--bg0));
      overflow:hidden;
    }

    /* Root */
    #app{
      height:100%;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      padding-bottom: calc(var(--navH) + env(safe-area-inset-bottom));
    }

    /* Top bar */
    .top{
      padding: 18px 16px 8px;
      position:sticky;
      top:0;
      z-index:5;
      background: linear-gradient(180deg, rgba(6,7,11,.92), rgba(6,7,11,.65), transparent);
      backdrop-filter: blur(8px);
    }
    .row{display:flex; align-items:center; justify-content:space-between; gap:12px}
    .brand{display:flex; align-items:center; gap:10px}
    .logo{
      width:34px; height:34px; border-radius:12px;
      background: radial-gradient(circle at 30% 30%, rgba(123,97,255,.9), rgba(94,139,255,.55));
      box-shadow: 0 10px 30px rgba(94,139,255,.28);
      border:1px solid rgba(255,255,255,.10);
    }
    .title{
      font-size:22px; font-weight:850; letter-spacing:.2px;
    }
    .sub{margin-top:2px; color:var(--muted); font-size:13px}

    .pill{
      display:flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background: rgba(20,26,36,.65);
      border:1px solid var(--stroke);
      box-shadow: 0 10px 40px rgba(0,0,0,.25);
      color:var(--muted);
      font-size:13px;
    }
    .dot{width:9px;height:9px;border-radius:50%; background:var(--good); box-shadow:0 0 0 4px rgba(52,199,89,.15)}
    .btnIcon{
      width:38px;height:38px;border-radius:14px;
      background: rgba(20,26,36,.55);
      border:1px solid var(--stroke);
      display:flex; align-items:center; justify-content:center;
      color:#cbd3e6;
    }

    /* Sections */
    .section{padding: 10px 16px}
    .h{
      margin: 16px 0 10px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing:.2px;
    }

    /* Cards */
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--stroke);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}

    .room{
      padding: 14px;
      min-height: 104px;
    }
    .roomName{font-weight:800; font-size:15px}
    .roomMeta{color:var(--muted); font-size:12px; margin-top:4px}
    .kvs{margin-top:10px; display:flex; flex-direction:column; gap:6px}
    .kv{display:flex; justify-content:space-between; color:var(--muted); font-size:13px}
    .kv b{color:#dfe6ff; font-weight:700}

    /* Device list */
    .device{
      padding: 14px;
      display:flex; align-items:center; justify-content:space-between;
      border-radius: var(--radius);
      background: rgba(20,26,36,.55);
      border:1px solid var(--stroke);
      box-shadow: 0 18px 60px rgba(0,0,0,.40);
      backdrop-filter: blur(10px);
      margin-top:12px;
    }
    .devLeft{min-width:0}
    .devName{font-weight:850; font-size:15px}
    .devSub{color:var(--muted); font-size:12px; margin-top:4px}
    .devRight{display:flex; align-items:center; gap:10px}

    /* Toggle */
    .toggle{
      width:52px; height:30px; border-radius:999px;
      background: rgba(255,255,255,.14);
      position:relative;
      border:1px solid rgba(255,255,255,.10);
      transition: .2s;
      flex:0 0 auto;
    }
    .toggle.on{
      background: linear-gradient(135deg, var(--a1), var(--a2));
      box-shadow: 0 12px 40px rgba(94,139,255,.35);
    }
    .knob{
      width:24px; height:24px; border-radius:50%;
      background:#fff;
      position:absolute; top:3px; left:3px;
      transition: .2s;
      box-shadow:0 10px 20px rgba(0,0,0,.25);
    }
    .toggle.on .knob{left:25px}

    /* Slider */
    .sliderWrap{
      margin-top:10px;
      background: rgba(10,12,18,.35);
      border:1px solid rgba(255,255,255,.06);
      border-radius: 16px;
      padding: 10px 12px;
    }
    input[type="range"]{
      width:100%;
      accent-color: var(--a2);
    }
    .sliderRow{
      display:flex; justify-content:space-between; align-items:center;
      color:var(--muted); font-size:12px; margin-bottom:6px;
    }

    /* Bottom nav */
    .nav{
      position:fixed;
      left: 10px;
      right: 10px;
      bottom: calc(10px + env(safe-area-inset-bottom));
      height: var(--navH);
      border-radius: 26px;
      background: rgba(15,18,26,.78);
      border:1px solid rgba(255,255,255,.08);
      box-shadow: 0 20px 80px rgba(0,0,0,.60);
      backdrop-filter: blur(12px);
      display:flex;
      padding: 10px;
      z-index: 10;
      gap: 8px;
    }
    .navBtn{
      flex:1;
      border-radius: 18px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      color: var(--muted);
      font-size:12px;
      border:1px solid transparent;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .navBtn.active{
      color:#e9edff;
      background: rgba(123,97,255,.12);
      border:1px solid rgba(123,97,255,.22);
      box-shadow: 0 12px 40px rgba(94,139,255,.18);
    }
    .ico{font-size:18px}

    /* Floating AI button */
    .aiFab{
      position:fixed;
      right:18px;
      bottom: calc(var(--navH) + 26px + env(safe-area-inset-bottom));
      width:60px; height:60px;
      border-radius: 22px;
      border:1px solid rgba(255,255,255,.12);
      background: radial-gradient(circle at 30% 30%, rgba(123,97,255,.95), rgba(94,139,255,.70));
      box-shadow: 0 20px 60px rgba(94,139,255,.35);
      display:flex; align-items:center; justify-content:center;
      color:white;
      font-size:22px;
      z-index: 11;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      transform: translateZ(0);
    }
    .aiFab:active{transform: scale(.98)}

    /* Bottom sheet */
    .overlay{
      position:fixed; inset:0;
      background: rgba(0,0,0,.56);
      backdrop-filter: blur(10px);
      z-index: 20;
      display:flex;
      align-items:flex-end;
    }
    .sheet{
      width:100%;
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      background: rgba(16,18,26,.92);
      border:1px solid rgba(255,255,255,.10);
      box-shadow: 0 30px 120px rgba(0,0,0,.70);
      padding: 14px 14px 16px;
      transform: translateY(0);
    }
    .grab{
      width:46px;height:5px;border-radius:999px;
      background: rgba(255,255,255,.18);
      margin: 6px auto 10px;
    }
    .sheetTitle{font-weight:900; font-size:16px}
    .sheetSub{color:var(--muted); font-size:12px; margin-top:4px}
    .input{
      margin-top:12px;
      width:100%;
      border-radius: 16px;
      padding: 14px 14px;
      border:1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.06);
      color: var(--text);
      outline:none;
      font-size: 14px;
    }
    .primary{
      margin-top:12px;
      width:100%;
      border-radius: 18px;
      padding: 14px 14px;
      border:none;
      background: linear-gradient(135deg,var(--a1),var(--a2));
      color:white;
      font-weight:900;
      letter-spacing:.2px;
      box-shadow: 0 20px 60px rgba(94,139,255,.30);
    }
    .chips{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
    .chip{
      padding:10px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.06);
      color:#d8def3;
      font-size:13px;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Lists */
    .list{margin-top:12px}
    .item{
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      margin-top:10px;
    }
    .itemT{font-weight:850}
    .itemS{color:var(--muted); font-size:12px; margin-top:4px}

    /* Error HUD */
    .hudErr{
      position:fixed;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 99;
      background: rgba(120,0,0,.35);
      border: 1px solid rgba(255,100,100,.25);
      color: #ffd6d6;
      padding: 10px 12px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      font-size: 12px;
      display:none;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="hudErr" id="hudErr"></div>
  <div id="app"></div>

  <script src="./core.js"></script>
  <script src="./ui.js"></script>
</body>
</html>
