<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <!-- запрет зума + safe area -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>AURA</title>

  <style>
    :root{
      --bg:#0b1220;
      --txt:#f2f4ff;
      --muted:rgba(255,255,255,.60);
      --muted2:rgba(255,255,255,.42);

      --panel:rgba(18,22,36,.58);
      --panel2:rgba(18,22,36,.42);
      --stroke:rgba(255,255,255,.10);

      --accent1:#7c5cff;
      --accent2:#b08cff;

      --shadow: 0 24px 70px rgba(0,0,0,.55);
      --shadowSoft: 0 14px 40px rgba(0,0,0,.45);

      --r20:20px;
      --r24:24px;
      --r28:28px;

      --tabBarH: 68px;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body{
      margin:0; padding:0;
      height:100%;
      background:var(--bg);
      color:var(--txt);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,Segoe UI,Roboto,Arial,sans-serif;
      overflow-x:hidden;
      overscroll-behavior: none;
    }

    /* на iOS иногда помогает от зума по double-tap */
    body{ touch-action: manipulation; }

    .app{
      min-height:100%;
      position:relative;
      padding-bottom: calc(var(--tabBarH) + 26px + env(safe-area-inset-bottom));
    }

    /* HERO */
    .hero{
      position:relative;
      height: 340px;
      width:100%;
      overflow:hidden;
      background: #0b1220;
    }
    .heroBg{
      position:absolute;
      inset:0;
      background-image: url("./assets/IMG_1348.jpeg"); /* <- поменяй имя если нужно */
      background-size: cover;
      background-position: center;
      transform: scale(1.06);
      filter: blur(0px);
    }
    .heroShade{
      position:absolute;
      inset:0;
      background:
        radial-gradient(1200px 420px at 50% 78%, rgba(12,14,22,.05) 0%, rgba(12,14,22,.55) 52%, rgba(12,14,22,.88) 100%),
        linear-gradient(180deg, rgba(11,18,32,.05) 0%, rgba(11,18,32,.72) 62%, rgba(11,18,32,.95) 100%);
    }

    .content{
      position:relative;
      padding: 18px 16px 0 16px;
      margin-top: -126px; /* как у Яндекса — контент “въезжает” на фон */
    }

    /* Заголовок */
    .titleRow{
      display:flex;
      align-items:flex-end;
      gap:12px;
    }
    .titles{
      flex:1;
    }
    h1{
      margin:0;
      font-size: 44px;
      line-height: .96;
      letter-spacing: -.02em;
      font-weight: 820;
      text-shadow: 0 14px 40px rgba(0,0,0,.55);
    }
    .sub{
      margin-top:8px;
      font-size: 16px;
      color: var(--muted2);
      font-weight: 520;
    }

    /* статус “всё спокойно” */
    .statusPill{
      margin-top:14px;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(16,18,26,.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 28px rgba(0,0,0,.35);
    }
    .dot{
      width:10px; height:10px;
      border-radius:999px;
      background: #21e07a;
      box-shadow: 0 0 0 4px rgba(33,224,122,.12), 0 0 18px rgba(33,224,122,.55);
    }
    .statusPill span{
      font-weight: 650;
      color: rgba(255,255,255,.86);
      letter-spacing: -.01em;
    }

    /* карточки */
    .cardsWrap{
      margin-top:16px;
      padding-top: 10px;
    }
    .cardsTitle{
      margin: 10px 0 10px;
      text-align:center;
      font-weight: 760;
      font-size: 22px;
      letter-spacing: -.01em;
      color: rgba(255,255,255,.90);
    }
    .cardsSub{
      margin: 0 0 16px;
      text-align:center;
      color: var(--muted2);
      font-weight: 520;
      font-size: 14px;
      line-height: 1.35;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .card{
      position:relative;
      border-radius: var(--r24);
      padding: 18px 16px 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadowSoft);
      overflow:hidden;
      min-height: 168px;
    }
    .card::before{
      content:"";
      position:absolute; inset:-1px;
      background: radial-gradient(500px 220px at 20% 0%, rgba(124,92,255,.22) 0%, transparent 55%),
                  radial-gradient(420px 240px at 90% 20%, rgba(176,140,255,.12) 0%, transparent 58%);
      pointer-events:none;
    }
    .cardInner{ position:relative; z-index:1; }

    /* Иконка в карточке — “стеклянная” */
    .iconGlass{
      width: 66px;
      height: 66px;
      border-radius: 18px;
      display:grid;
      place-items:center;
      margin-bottom: 14px;

      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06));
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow:
        0 16px 40px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.16);
    }
    .iconGlass img{
      width: 28px; height: 28px;
      opacity: .95;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
    }

    .card h3{
      margin:0 0 8px;
      font-size: 22px;
      line-height: 1.08;
      font-weight: 820;
      letter-spacing: -.015em;
      color: rgba(255,255,255,.92);
    }
    .card p{
      margin:0;
      font-size: 14px;
      line-height: 1.35;
      color: var(--muted2);
      font-weight: 560;
    }

    /* большой блок “ИИ-команда” */
    .aiBlock{
      margin-top: 14px;
      border-radius: var(--r28);
      padding: 18px 16px 16px;
      background: rgba(18,22,36,.55);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }
    .aiBlock::before{
      content:"";
      position:absolute; inset:-1px;
      background:
        radial-gradient(600px 260px at 20% 10%, rgba(124,92,255,.22), transparent 55%),
        radial-gradient(520px 260px at 85% 100%, rgba(176,140,255,.16), transparent 55%);
      pointer-events:none;
    }
    .aiInner{ position:relative; z-index:1; }

    .aiTitle{
      font-size: 28px;
      font-weight: 880;
      letter-spacing: -.02em;
      margin: 2px 0 14px;
    }

    .aiInput{
      width:100%;
      padding: 16px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.88);
      font-weight: 560;
      outline:none;
      font-size: 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
    }
    .aiInput::placeholder{ color: rgba(255,255,255,.38); }

    /* кнопка “миллион” + активная анимация */
    .cta{
      margin-top: 14px;
      width:100%;
      border:0;
      border-radius: 18px;
      padding: 18px 16px;
      font-size: 20px;
      font-weight: 880;
      letter-spacing: -.01em;
      color: rgba(255,255,255,.95);
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      box-shadow: 0 18px 50px rgba(124,92,255,.35), 0 8px 24px rgba(0,0,0,.35);
      transform: translateZ(0);
      transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
    }
    .cta:active{
      transform: scale(.985);
      filter: saturate(1.12) brightness(1.02);
      box-shadow: 0 16px 42px rgba(124,92,255,.42), 0 6px 18px rgba(0,0,0,.38);
    }

    /* ====== TELEGRAM-STYLE DOCK BAR (premium) ====== */
    .dockWrap{
      position: fixed;
      left: 0; right: 0;
      bottom: 0;
      z-index: 1000;

      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      pointer-events: none; /* чтобы клики были только по бару */
    }

    .dock{
      pointer-events: auto;
      height: var(--tabBarH);
      border-radius: 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 6px;

      padding: 10px 12px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06)),
        rgba(16,18,26,.55);
      border: 1px solid rgba(255,255,255,.12);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      box-shadow:
        0 20px 60px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.14);
      position: relative;
      overflow:hidden;
    }

    /* лёгкая “дорогая” подсветка внутри, как стекло */
    .dock::before{
      content:"";
      position:absolute;
      inset:-1px;
      background: radial-gradient(420px 160px at 30% 0%, rgba(124,92,255,.16), transparent 60%),
                  radial-gradient(420px 180px at 80% 120%, rgba(176,140,255,.12), transparent 60%);
      pointer-events:none;
    }

    .tab{
      flex: 1;
      height: 48px;
      border-radius: 16px;
      display:flex;
      flex-direction: column;
      align-items:center;
      justify-content:center;
      gap: 4px;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.52);
      transition: background .18s ease, color .18s ease, transform .12s ease;
      position:relative;
      user-select:none;
    }
    .tab:active{ transform: scale(.98); }

    .tab img{
      width: 22px;
      height: 22px;
      opacity: .82;
      transition: opacity .18s ease, filter .18s ease;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,.35));
    }
    .tab span{
      font-size: 11px;
      font-weight: 650;
      letter-spacing: -.01em;
      opacity: .88;
    }

    /* активная вкладка */
    .tab.active{
      color: rgba(255,255,255,.92);
      background: rgba(255,255,255,.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
    }
    .tab.active img{
      opacity: 1;
      filter: drop-shadow(0 10px 20px rgba(124,92,255,.35));
    }
    .tab.active::after{
      content:"";
      position:absolute;
      left: 14px; right: 14px;
      bottom: 4px;
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, rgba(124,92,255,.0), rgba(124,92,255,.95), rgba(176,140,255,.95), rgba(176,140,255,.0));
      box-shadow: 0 0 16px rgba(124,92,255,.45);
      opacity: .85;
    }

    /* центральная кнопка "+" как у Telegram но premium */
    .plusSlot{
      flex: 1;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
    }
    .plusBtn{
      width: 56px;
      height: 56px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.16);
      background:
        linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow:
        0 18px 46px rgba(0,0,0,.55),
        0 0 0 1px rgba(124,92,255,.18),
        0 0 26px rgba(124,92,255,.22),
        inset 0 1px 0 rgba(255,255,255,.16);
      display:grid;
      place-items:center;
      transform: translateY(-6px);
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    }
    .plusBtn img{
      width: 22px;
      height: 22px;
      opacity: .95;
      filter: drop-shadow(0 10px 22px rgba(124,92,255,.35));
    }
    .plusBtn:active{
      transform: translateY(-6px) scale(.97);
      filter: saturate(1.15);
      box-shadow:
        0 16px 40px rgba(0,0,0,.55),
        0 0 0 1px rgba(124,92,255,.26),
        0 0 34px rgba(124,92,255,.32),
        inset 0 1px 0 rgba(255,255,255,.18);
    }

    /* чуть больше “воздуха” сверху у карточек, как у рефа */
    @media (max-width: 380px){
      h1{ font-size: 40px; }
      .aiTitle{ font-size: 26px; }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="hero">
      <div class="heroBg"></div>
      <div class="heroShade"></div>
    </div>

    <main class="content">
      <div class="titleRow">
        <div class="titles">
          <h1>Мой дом</h1>
          <div class="sub">Пока нет устройств</div>

          <div class="statusPill" aria-label="Статус">
            <div class="dot"></div>
            <span>Всё спокойно</span>
          </div>
        </div>
      </div>

      <section class="cardsWrap">
        <div class="cardsTitle">Пока нет устройств</div>
        <div class="cardsSub">Добавьте устройство и управляйте им из приложения</div>

        <div class="grid">
          <div class="card">
            <div class="cardInner">
              <div class="iconGlass">
                <img src="./assets/icons/home.svg" alt="Дом" />
              </div>
              <h3>Устройства с<br/>Алисой</h3>
              <p>Яндекс, Xiaomi, JBL, LG, Elari, Irbis, Dexp, Prestigio</p>
            </div>
          </div>

          <div class="card">
            <div class="cardInner">
              <div class="iconGlass">
                <img src="./assets/icons/catalog.svg" alt="Умный дом" />
              </div>
              <h3>Устройства<br/>умного дома</h3>
              <p>Свет, розетки, телевизор</p>
            </div>
          </div>
        </div>

        <div class="aiBlock">
          <div class="aiInner">
            <div class="aiTitle">ИИ-команда для Алисы</div>
            <input class="aiInput" type="text" placeholder="Например: включи свет в гостиной на 30%" />
            <button class="cta" type="button">Сформировать команду</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- TELEGRAM STYLE DOCK -->
  <div class="dockWrap">
    <nav class="dock" aria-label="Навигация">
      <button class="tab active" type="button">
        <img src="./assets/icons/home.svg" alt="" />
        <span>Мой дом</span>
      </button>

      <button class="tab" type="button">
        <img src="./assets/icons/scenes.svg" alt="" />
        <span>Сценарии</span>
      </button>

      <div class="plusSlot">
        <button class="plusBtn" type="button" aria-label="Добавить">
          <img src="./assets/icons/plus.svg" alt="" />
        </button>
      </div>

      <button class="tab" type="button">
        <img src="./assets/icons/catalog.svg" alt="" />
        <span>Каталог</span>
      </button>

      <button class="tab" type="button">
        <img src="./assets/icons/tips.svg" alt="" />
        <span>Советы</span>
      </button>
    </nav>
  </div>

  <script>
    // активная вкладка + лёгкая “премиум” анимация переключения
    const tabs = Array.from(document.querySelectorAll('.tab'));
    tabs.forEach(t => {
      t.addEventListener('click', () => {
        tabs.forEach(x => x.classList.remove('active'));
        t.classList.add('active');
      }, {passive:true});
    });

    // на всякий: гасим жест “pinch” (iOS Safari иногда всё равно пытается)
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('gesturechange', e => e.preventDefault());
    document.addEventListener('gestureend', e => e.preventDefault());
  </script>
</body>
</html>
