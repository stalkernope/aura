<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AURA</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:#0b0f1a;
  color:white;
  overflow-x:hidden;
}

/* ===== HERO ===== */

.hero{
  position:relative;
  height:320px;
  width:100%;
  background:url("./assets/hero.jpg") center/cover no-repeat;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom, rgba(11,15,26,0.1), #0b0f1a 85%);
}

/* ===== HEADER ===== */

.header{
  padding:24px;
  position:relative;
  z-index:2;
}

.title{
  font-size:40px;
  font-weight:800;
  line-height:1.1;
}

.subtitle{
  opacity:.6;
  margin-top:6px;
}

/* ===== STATUS ===== */

.status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:16px;
  padding:10px 18px;
  border-radius:999px;
  backdrop-filter:blur(12px);
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
}

.dot{
  width:10px;
  height:10px;
  background:#2eff84;
  border-radius:50%;
  box-shadow:0 0 12px #2eff84;
}

/* ===== CARDS ===== */

.section{
  padding:0 20px;
  margin-top:-40px;
  position:relative;
  z-index:2;
}

.cards{
  display:flex;
  gap:16px;
  margin-top:20px;
}

.card{
  flex:1;
  padding:20px;
  border-radius:22px;
  backdrop-filter:blur(18px);
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  transition:.3s;
}

.card:hover{
  transform:translateY(-4px);
}

.card img{
  width:44px;
  height:44px;
  padding:10px;
  border-radius:14px;
  background:rgba(255,255,255,.08);
  box-shadow:0 0 20px rgba(122,92,255,.4);
  margin-bottom:16px;
}

/* ===== AI BLOCK ===== */

.ai-block{
  margin-top:28px;
  padding:22px;
  border-radius:26px;
  backdrop-filter:blur(18px);
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
}

.ai-input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  margin-top:12px;
  background:rgba(255,255,255,.07);
  color:white;
}

.ai-btn{
  width:100%;
  margin-top:18px;
  padding:18px;
  border:none;
  border-radius:18px;
  font-size:18px;
  font-weight:600;
  color:white;
  background:linear-gradient(135deg,#7a5cff,#b78dff);
  box-shadow:0 0 30px rgba(122,92,255,.6);
  transition:.25s;
}

.ai-btn:active{
  transform:scale(.96);
  box-shadow:0 0 60px rgba(122,92,255,.9);
}

/* ===== BOTTOM NAV ===== */

.bottom{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  padding:12px 16px;
  border-radius:28px;
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.bottom-item{
  text-align:center;
  font-size:12px;
  opacity:.6;
}

.bottom-item img{
  width:22px;
  height:22px;
  margin-bottom:4px;
}

.active{
  opacity:1;
}

.center-btn{
  position:absolute;
  top:-26px;
  left:50%;
  transform:translateX(-50%);
  width:58px;
  height:58px;
  border-radius:50%;
  background:linear-gradient(135deg,#7a5cff,#b78dff);
  box-shadow:0 0 40px rgba(122,92,255,.9);
  display:flex;
  align-items:center;
  justify-content:center;
}

.center-btn img{
  width:26px;
  height:26px;
}

</style>
</head>

<body>

<div class="hero"></div>

<div class="header">
  <div class="title">Мой дом</div>
  <div class="subtitle">Пока нет устройств</div>

  <div class="status">
    <div class="dot"></div>
    Всё спокойно
  </div>
</div>

<div class="section">

  <div class="cards">

    <div class="card">
      <img src="./assets/icons/home.svg">
      <div style="font-weight:600">Устройства с Алисой</div>
      <div style="opacity:.6;margin-top:6px;font-size:14px">
        Яндекс, Xiaomi, JBL и другие
      </div>
    </div>

    <div class="card">
      <img src="./assets/icons/catalog.svg">
      <div style="font-weight:600">Устройства умного дома</div>
      <div style="opacity:.6;margin-top:6px;font-size:14px">
        Свет, розетки, телевизор
      </div>
    </div>

  </div>

  <div class="ai-block">
    <div style="font-weight:600;font-size:18px">ИИ-команда для Алисы</div>
    <input class="ai-input" placeholder="Например: включи свет в гостиной на 30%">
    <button class="ai-btn">Сформировать команду</button>
  </div>

</div>

<div class="bottom">

  <div class="bottom-item active">
    <img src="./assets/icons/home.svg">
    <div>Мой дом</div>
  </div>

  <div class="bottom-item">
    <img src="./assets/icons/scenes.svg">
    <div>Сценарии</div>
  </div>

  <div class="center-btn">
    <img src="./assets/icons/plus.svg">
  </div>

  <div class="bottom-item">
    <img src="./assets/icons/catalog.svg">
    <div>Каталог</div>
  </div>

  <div class="bottom-item">
    <img src="./assets/icons/tips.svg">
    <div>Советы</div>
  </div>

</div>

</body>
</html>
