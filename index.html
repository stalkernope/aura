<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AURA</title>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
background:#0b0f18;
color:white;
}

.app{
min-height:100vh;
display:flex;
flex-direction:column;
}

.topHero{
position:relative;
height:260px;
overflow:hidden;
}

.topHero .img{
position:absolute;
inset:0;
background-image:url('./assets/hero.jpg');
background-size:cover;
background-position:center;
transform:scale(1.05);
}

.topHero .veil{
position:absolute;
inset:0;
background:linear-gradient(180deg,rgba(11,15,24,.2) 0%,#0b0f18 85%);
}

.content{
padding:20px;
margin-top:-80px;
position:relative;
z-index:2;
}

h1{
font-size:36px;
margin:0 0 6px 0;
font-weight:800;
}

.sub{
color:rgba(255,255,255,.6);
margin-bottom:20px;
}

.status{
display:inline-flex;
align-items:center;
padding:8px 14px;
border-radius:20px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.08);
margin-bottom:20px;
}

.dot{
width:8px;
height:8px;
border-radius:50%;
background:#00ff88;
margin-right:8px;
box-shadow:0 0 8px #00ff88;
}

.cards{
display:flex;
gap:14px;
}

.card{
flex:1;
background:rgba(255,255,255,.05);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.08);
border-radius:22px;
padding:20px;
transition:.3s;
}

.card:hover{
transform:translateY(-4px);
box-shadow:0 0 30px rgba(122,92,255,.3);
}

.cardIcon{
width:60px;
height:60px;
border-radius:18px;
background:rgba(255,255,255,.08);
display:flex;
align-items:center;
justify-content:center;
margin-bottom:14px;
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);
box-shadow:0 0 25px rgba(122,92,255,.25);
}

.cardIcon img{
width:36px;
height:36px;
filter:drop-shadow(0 0 6px rgba(180,120,255,.6));
}

.card h3{
margin:0 0 6px 0;
font-size:16px;
}

.card p{
margin:0;
color:rgba(255,255,255,.6);
font-size:13px;
}

.aiBox{
margin-top:28px;
background:rgba(255,255,255,.05);
border-radius:24px;
padding:20px;
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(20px);
}

.aiInput{
width:100%;
padding:14px 16px;
border-radius:16px;
border:1px solid rgba(255,255,255,.1);
background:rgba(255,255,255,.05);
color:white;
outline:none;
margin-bottom:16px;
}

.aiBtn{
width:100%;
padding:16px;
border-radius:20px;
border:none;
background:linear-gradient(90deg,#7a5cff,#b88dff);
color:white;
font-size:16px;
font-weight:700;
cursor:pointer;
transition:.3s;
box-shadow:0 0 30px rgba(122,92,255,.4);
}

.aiBtn:active{
transform:scale(.96);
box-shadow:0 0 40px rgba(122,92,255,.8);
}

.bottomNav{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border-radius:30px;
padding:10px 18px;
display:flex;
gap:30px;
border:1px solid rgba(255,255,255,.1);
}

.navItem{
display:flex;
flex-direction:column;
align-items:center;
font-size:11px;
color:rgba(255,255,255,.5);
}

.navItem img{
width:22px;
height:22px;
margin-bottom:4px;
filter:drop-shadow(0 0 6px rgba(150,100,255,.5));
}

.navItem.active{
color:white;
}

.centerGlow{
position:fixed;
bottom:45px;
left:50%;
transform:translateX(-50%);
width:70px;
height:70px;
border-radius:50%;
background:linear-gradient(145deg,#7a5cff,#b88dff);
box-shadow:0 0 60px rgba(122,92,255,.8);
}
</style>
</head>

<body>

<div class="app">

<div class="topHero">
<div class="img"></div>
<div class="veil"></div>
</div>

<div class="content">
<h1>Мой дом</h1>
<div class="sub">Пока нет устройств</div>

<div class="status">
<div class="dot"></div>
Всё спокойно
</div>

<div class="cards">
<div class="card">
<div class="cardIcon">
<img src="./assets/icons/home.svg">
</div>
<h3>Устройства с Алисой</h3>
<p>Яндекс, Xiaomi, JBL и другие</p>
</div>

<div class="card">
<div class="cardIcon">
<img src="./assets/icons/catalog.svg">
</div>
<h3>Устройства умного дома</h3>
<p>Свет, розетки, телевизор</p>
</div>
</div>

<div class="aiBox">
<input class="aiInput" placeholder="Например: включи свет в гостиной на 30%">
<button class="aiBtn">Сформировать команду</button>
</div>

</div>

<div class="centerGlow"></div>

<div class="bottomNav">
<div class="navItem active">
<img src="./assets/icons/home.svg">
Мой дом
</div>

<div class="navItem">
<img src="./assets/icons/scenes.svg">
Сценарии
</div>

<div class="navItem">
<img src="./assets/icons/catalog.svg">
Каталог
</div>

<div class="navItem">
<img src="./assets/icons/tips.svg">
Советы
</div>
</div>

</div>

</body>
</html>
