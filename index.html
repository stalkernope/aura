<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#0b1220;
  color:#fff;
  -webkit-font-smoothing:antialiased;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* HERO */

.topHero{
  position:relative;
  height:260px;
  overflow:hidden;
}

.topHero img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(1.05);
  filter:brightness(.85);
}

.topHero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(8,12,22,.3),rgba(8,12,22,.95));
}

/* CONTENT */

.content{
  padding:24px;
  margin-top:-80px;
}

h1{
  font-size:38px;
  margin:0 0 6px 0;
}

.subtitle{
  opacity:.6;
  margin-bottom:20px;
}

/* STATUS */

.status{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:12px 18px;
  border-radius:30px;
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
}

.dot{
  width:10px;
  height:10px;
  background:#2bff88;
  border-radius:50%;
  box-shadow:0 0 15px #2bff88;
}

/* CARDS */

.cards{
  margin-top:30px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.card{
  padding:22px;
  border-radius:22px;
  backdrop-filter:blur(25px);
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  transition:.3s;
}

.card:hover{
  transform:translateY(-4px);
}

.iconWrap{
  width:60px;
  height:60px;
  border-radius:18px;
  background:rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:14px;
  box-shadow:0 0 25px rgba(122,92,255,.4);
}

.iconWrap img{
  width:28px;
}

/* AI BLOCK */

.aiBlock{
  margin-top:28px;
  padding:22px;
  border-radius:22px;
  backdrop-filter:blur(25px);
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
}

.aiInput{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:rgba(255,255,255,.08);
  color:#fff;
  margin-bottom:16px;
}

.aiBtn{
  width:100%;
  padding:16px;
  border-radius:16px;
  border:none;
  font-weight:600;
  font-size:16px;
  color:#fff;
  background:linear-gradient(90deg,#6f5bff,#b47dff);
  box-shadow:0 10px 40px rgba(122,92,255,.6);
  transition:.3s;
}

.aiBtn:active{
  transform:scale(.97);
  box-shadow:0 0 60px rgba(122,92,255,1);
}

/* BOTTOM NAV */

.bottomNav{
  position:fixed;
  bottom:20px;
  left:20px;
  right:20px;
  height:70px;
  border-radius:30px;
  backdrop-filter:blur(25px);
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.navItem{
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:12px;
  opacity:.6;
}

.navItem img{
  width:24px;
  margin-bottom:4px;
}

.navItem.active{
  opacity:1;
}
</style>
</head>

<body>
<div class="app">

<div class="topHero">
<img src="assets/IMG_1348.jpeg">
</div>

<div class="content">
<h1>Мой дом</h1>
<div class="subtitle">Пока нет устройств</div>

<div class="status">
<div class="dot"></div>
Всё спокойно
</div>

<div class="cards">

<div class="card">
<div class="iconWrap">
<img src="assets/icons/home.svg">
</div>
<h3>Устройства с Алисой</h3>
<div style="opacity:.6;font-size:14px;">
Яндекс, Xiaomi, JBL и другие
</div>
</div>

<div class="card">
<div class="iconWrap">
<img src="assets/icons/catalog.svg">
</div>
<h3>Устройства умного дома</h3>
<div style="opacity:.6;font-size:14px;">
Свет, розетки, телевизор
</div>
</div>

</div>

<div class="aiBlock">
<h3>ИИ-команда для Алисы</h3>
<input class="aiInput" placeholder="Например: включи свет в гостиной на 30%">
<button class="aiBtn">Сформировать команду</button>
</div>

</div>

<div class="bottomNav">
<div class="navItem active">
<img src="assets/icons/home.svg">
Мой дом
</div>

<div class="navItem">
<img src="assets/icons/scenes.svg">
Сценарии
</div>

<div class="navItem">
<img src="assets/icons/catalog.svg">
Каталог
</div>

<div class="navItem">
<img src="assets/icons/tips.svg">
Советы
</div>
</div>

</div>
</body>
</html>
