<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>AURA</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  height:100%;
  background:#0b1220;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  overflow-x:hidden;
  touch-action:manipulation;
}

/* HERO */
.hero{
  position:relative;
  height:340px;
  width:100%;
  background:url("./assets/IMG_1348.jpeg") center/cover no-repeat;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,0.2),#0b1220 85%);
}

/* контент */
.content{
  padding:24px;
  padding-bottom:140px;
}

/* статус */
.status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 18px;
  border-radius:30px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);
  margin-top:16px;
}

.status-dot{
  width:10px;
  height:10px;
  background:#00ff88;
  border-radius:50%;
  box-shadow:0 0 12px #00ff88;
}

/* карточки */
.cards{
  display:flex;
  gap:16px;
  margin-top:24px;
}

.card{
  flex:1;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border-radius:24px;
  padding:20px;
  border:1px solid rgba(255,255,255,0.08);
}

.card-icon{
  width:70px;
  height:70px;
  margin-bottom:16px;
  border-radius:20px;
  background:rgba(255,255,255,0.08);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 40px rgba(140,100,255,.4);
}

/* кнопка */
.button{
  width:100%;
  padding:18px;
  border:none;
  border-radius:20px;
  font-size:18px;
  font-weight:600;
  color:white;
  background:linear-gradient(90deg,#7c5cff,#b28dff);
  margin-top:16px;
  transition:.2s;
}

.button:active{
  transform:scale(.97);
  box-shadow:0 0 40px rgba(150,120,255,.8);
}

/* нижний док бар */
.bottomNav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  display:flex;
  justify-content:space-around;
  align-items:center;

  padding:14px 0 calc(20px + env(safe-area-inset-bottom));

  background:rgba(18,22,38,.75);
  backdrop-filter:blur(25px);
  border-top:1px solid rgba(255,255,255,.08);

  z-index:1000;
}

.bottomNav div{
  text-align:center;
  font-size:12px;
  opacity:.7;
}
.bottomNav .active{
  opacity:1;
  color:#b28dff;
}
</style>

</head>
<body>

<div class="hero"></div>

<div class="content">

<h1 style="font-size:34px;">Мой дом</h1>
<p style="opacity:.6;margin-top:6px;">Пока нет устройств</p>

<div class="status">
<div class="status-dot"></div>
Всё спокойно
</div>

<div class="cards">

<div class="card">
<div class="card-icon">🏠</div>
<h3>Устройства с Алисой</h3>
<p style="opacity:.6;margin-top:6px;">Яндекс, Xiaomi, JBL и другие</p>
</div>

<div class="card">
<div class="card-icon">📦</div>
<h3>Устройства умного дома</h3>
<p style="opacity:.6;margin-top:6px;">Свет, розетки, телевизор</p>
</div>

</div>

<div style="margin-top:30px;">
<h3>ИИ-команда для Алисы</h3>
<input placeholder="Например: включи свет в гостиной на 30%" 
style="width:100%;margin-top:12px;padding:14px;border-radius:18px;border:none;background:rgba(255,255,255,0.07);color:white;outline:none;">
<button class="button">Сформировать команду</button>
</div>

</div>

<div class="bottomNav">
<div class="active">🏠<br>Мой дом</div>
<div>⚙️<br>Сценарии</div>
<div>📂<br>Каталог</div>
<div>ℹ️<br>Советы</div>
</div>

</body>
</html>
