<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AURA</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  height:100%;
  background:#0b1220;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  color:white;
  overflow-x:hidden;
}

/* HERO */
.hero{
  position:relative;
  height:340px;
  width:100%;
  background:url("assets/IMG_1348.jpeg") center/cover no-repeat;
}

.hero::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:180px;
  background:linear-gradient(to bottom,transparent,#0b1220);
}

/* CONTENT */
.content{
  padding:24px;
  padding-bottom:140px;
}

h1{
  font-size:42px;
  font-weight:700;
  margin-bottom:8px;
}

.sub{
  opacity:.6;
  margin-bottom:16px;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 16px;
  border-radius:20px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  margin-bottom:28px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#00ff66;
  box-shadow:0 0 12px #00ff66;
}

/* CARDS */
.cards{
  display:flex;
  gap:16px;
  margin-bottom:32px;
}

.card{
  flex:1;
  padding:20px;
  border-radius:22px;
  background:linear-gradient(145deg,rgba(140,120,255,.15),rgba(80,70,140,.2));
  border:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(25px);
}

.card h3{
  margin-bottom:8px;
}

.card p{
  font-size:14px;
  opacity:.6;
}

/* AI BLOCK */
.ai{
  padding:22px;
  border-radius:26px;
  background:linear-gradient(145deg,rgba(150,120,255,.25),rgba(60,40,110,.4));
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(30px);
}

.ai h2{
  margin-bottom:14px;
}

.ai input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:rgba(255,255,255,.08);
  margin-bottom:16px;
  color:white;
}

.button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:18px;
  background:linear-gradient(90deg,#7c5cff,#b28dff);
  color:white;
  font-weight:600;
  font-size:16px;
  box-shadow:0 0 30px rgba(140,100,255,.6);
  transition:.2s;
}

.button:active{
  transform:scale(.97);
}

/* TELEGRAM STYLE PREMIUM DOCK */
.bottomNav{
  position:fixed;
  left:16px;
  right:16px;
  bottom:16px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:14px 20px;

  background:rgba(25,28,45,.55);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);

  border-radius:28px;
  border:1px solid rgba(255,255,255,.08);

  box-shadow:
    0 10px 40px rgba(0,0,0,.6),
    inset 0 0 20px rgba(255,255,255,.05);

  z-index:1000;
}

.nav-item{
  flex:1;
  text-align:center;
  font-size:12px;
  color:rgba(255,255,255,.5);
  transition:.3s;
}

.nav-item.active{
  color:#fff;
  text-shadow:0 0 15px rgba(160,120,255,.7);
}

.nav-item span{
  display:block;
  font-size:20px;
  margin-bottom:4px;
}

.nav-center{
  width:56px;
  height:56px;
  border-radius:18px;

  background:linear-gradient(145deg,#8f7cff,#b28dff);
  box-shadow:
    0 8px 25px rgba(140,100,255,.6),
    inset 0 0 15px rgba(255,255,255,.4);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:26px;
  color:white;

  transform:translateY(-18px);
}

</style>
</head>

<body>

<div class="hero"></div>

<div class="content">

<h1>Мой дом</h1>
<div class="sub">Пока нет устройств</div>

<div class="status">
  <div class="dot"></div>
  Всё спокойно
</div>

<div class="cards">
  <div class="card">
    <h3>Устройства с Алисой</h3>
    <p>Яндекс, Xiaomi, JBL и другие</p>
  </div>

  <div class="card">
    <h3>Устройства умного дома</h3>
    <p>Свет, розетки, телевизор</p>
  </div>
</div>

<div class="ai">
  <h2>ИИ-команда для Алисы</h2>
  <input placeholder="Например: включи свет в гостиной на 30%">
  <button class="button">Сформировать команду</button>
</div>

</div>

<div class="bottomNav">

  <div class="nav-item active">
    <span>🏠</span>
    Мой дом
  </div>

  <div class="nav-item">
    <span>📋</span>
    Сценарии
  </div>

  <div class="nav-center">+</div>

  <div class="nav-item">
    <span>📦</span>
    Каталог
  </div>

  <div class="nav-item">
    <span>ℹ️</span>
    Советы
  </div>

</div>

</body>
</html>
