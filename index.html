<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AURA — Smart Home Center</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  :root{
    --bg0:#070A12;
    --bg1:#0B0F1A;

    --cardA: rgba(255,255,255,.07);
    --cardB: rgba(255,255,255,.05);
    --line: rgba(255,255,255,.10);

    --txt:#EAF0FF;
    --muted: rgba(234,240,255,.62);

    --a1:#7A2BFF;
    --a2:#2B7CFF;
    --glow: rgba(122,43,255,.38);
    --glow2: rgba(43,124,255,.28);

    --ok:#37D67A;
    --warn:#FFCC66;
    --bad:#FF5C7A;

    --radius: 18px;
    --shadow: 0 18px 55px rgba(0,0,0,.55);
    --tap: 0.985;
  }

  body.light{
    --bg0:#F4F7FF;
    --bg1:#EEF3FF;

    --cardA: rgba(14,18,32,.07);
    --cardB: rgba(14,18,32,.05);
    --line: rgba(14,18,32,.10);

    --txt:#0E1220;
    --muted: rgba(14,18,32,.62);

    --glow: rgba(43,124,255,.20);
    --glow2: rgba(122,43,255,.14);

    --shadow: 0 18px 55px rgba(10,20,40,.18);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
    color:var(--txt);
    overflow:hidden;
    background:
      radial-gradient(1200px 800px at 50% -10%, rgba(122,43,255,.24), transparent 60%),
      radial-gradient(900px 700px at 85% 20%, rgba(43,124,255,.16), transparent 55%),
      linear-gradient(180deg, var(--bg0), var(--bg1));
  }

  .safeTop{ padding-top: env(safe-area-inset-top); }
  .safeBottom{ padding-bottom: env(safe-area-inset-bottom); }

  .app{
    height:100%;
    display:flex;
    flex-direction:column;
  }

  /* Top bar */
  .topbar{
    position:sticky;
    top:0;
    z-index:30;
    padding: 14px 14px 10px;
    backdrop-filter: blur(14px);
    background: linear-gradient(180deg, rgba(0,0,0,.24), transparent);
  }
  body.light .topbar{
    background: linear-gradient(180deg, rgba(255,255,255,.70), transparent);
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .logoWrap{
    width:36px;height:36px;
    border-radius:14px;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.35), transparent 55%),
                linear-gradient(135deg, var(--a1), var(--a2));
    box-shadow: 0 0 22px var(--glow);
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
  }
  .logoWrap svg{ width:22px;height:22px; }
  .titleWrap{ min-width:0; }
  .title{
    font-weight:800;
    letter-spacing:.08em;
    font-size:14px;
  }
  .subtitle{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width: 62vw;
  }

  .iconBtn{
    border:1px solid var(--line);
    background: linear-gradient(180deg, var(--cardA), var(--cardB));
    color:var(--txt);
    border-radius: 14px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:8px;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
    transition: transform .12s ease, box-shadow .18s ease, opacity .18s ease;
    cursor:pointer;
    user-select:none;
  }
  .iconBtn:active{ transform: scale(var(--tap)); }
  .pill{
    font-size:12px;
    padding:4px 8px;
    border-radius:999px;
    border:1px solid var(--line);
    background: rgba(255,255,255,.04);
    color:var(--muted);
  }

  /* Content with smooth tab transitions */
  .content{
    flex:1;
    overflow:auto;
    padding: 6px 14px 98px;
  }
  .view{
    opacity:0;
    transform: translateY(8px);
    transition: opacity .22s ease, transform .22s ease;
  }
  .view.show{
    opacity:1;
    transform: translateY(0);
  }

  .card{
    border:1px solid var(--line);
    background: linear-gradient(180deg, var(--cardA), var(--cardB));
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding:14px;
  }

  .glowBorder{
    position:relative;
    overflow:hidden;
  }
  .glowBorder:before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius: calc(var(--radius) + 1px);
    background:
      radial-gradient(700px 220px at 50% 0%, rgba(122,43,255,.35), transparent 55%),
      radial-gradient(700px 220px at 85% 55%, rgba(43,124,255,.20), transparent 55%);
    opacity:.75;
    pointer-events:none;
    filter: blur(10px);
  }
  .glowBorder > *{ position:relative; z-index:1; }

  .h1{
    font-size:16px;
    margin:0 0 10px;
    letter-spacing:.02em;
  }
  .muted{
    color:var(--muted);
    font-size:13px;
    line-height:1.35;
  }

  .input{
    width:100%;
    border-radius: 16px;
    border:1px solid var(--line);
    background: rgba(0,0,0,.18);
    color:var(--txt);
    padding: 14px 14px;
    font-size:15px;
    outline:none;
    box-shadow: 0 0 18px rgba(122,43,255,.14);
    transition: box-shadow .18s ease, transform .12s ease;
  }
  .input:focus{
    box-shadow: 0 0 26px var(--glow);
    transform: translateY(-1px);
  }
  body.light .input{
    background: rgba(255,255,255,.72);
    box-shadow: 0 0 18px rgba(43,124,255,.10);
  }

  .btn{
    width:100%;
    border:none;
    border-radius: 18px;
    padding: 14px 14px;
    font-size:15px;
    color:white;
    background: linear-gradient(90deg, var(--a1), var(--a2));
    box-shadow: 0 0 26px var(--glow);
    cursor:pointer;
    transition: transform .12s ease, box-shadow .18s ease, opacity .18s ease;
    user-select:none;
  }
  .btn:active{ transform: scale(var(--tap)); }
  .btn.secondary{
    background: rgba(255,255,255,.06);
    color:var(--txt);
    border:1px solid var(--line);
    box-shadow:none;
  }

  .kbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
  }
  .kbtn{
    padding:10px 12px;
    border-radius: 999px;
    border:1px solid var(--line);
    background: rgba(255,255,255,.05);
    color: var(--txt);
    cursor:pointer;
    user-select:none;
    font-size:13px;
    transition: transform .12s ease, box-shadow .18s ease;
  }
  .kbtn:active{ transform:scale(var(--tap)); }
  .kbtn:hover{ box-shadow: 0 0 18px rgba(122,43,255,.10); }

  .grid2{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
  }

  .chip{
    border:1px solid var(--line);
    background: rgba(255,255,255,.05);
    color: var(--txt);
    border-radius: 16px;
    padding: 12px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    cursor:pointer;
    user-select:none;
    transition: transform .12s ease, box-shadow .18s ease;
  }
  .chip:active{ transform: scale(var(--tap)); }
  .chip small{ color:var(--muted); display:block; margin-top:2px; }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    border:1px solid var(--line);
    background: rgba(255,255,255,.05);
    border-radius: 999px;
    padding: 6px 10px;
    font-size:12px;
    color: var(--muted);
  }
  .dot{ width:8px;height:8px;border-radius:99px;background: var(--warn); }
  .dot.ok{ background: var(--ok); }
  .dot.bad{ background: var(--bad); }

  .resultBox{
    margin-top:12px;
    border-radius: 16px;
    border:1px solid var(--line);
    background: rgba(0,0,0,.18);
    padding: 12px;
    line-height:1.45;
    white-space:pre-wrap;
  }
  body.light .resultBox{ background: rgba(255,255,255,.65); }

  .actions{
    display:flex;
    gap:10px;
    margin-top:10px;
  }
  .actions .btn{ flex:1; padding: 12px; border-radius: 16px; font-size:14px; }

  .list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:10px;
  }
  .item{
    border:1px solid var(--line);
    border-radius: 16px;
    background: rgba(255,255,255,.05);
    padding: 12px;
  }
  .itemTop{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
  }
  .itemTitle{ font-weight:700; font-size:14px; }
  .itemMeta{ color:var(--muted); font-size:12px; margin-top:2px; }
  .miniBtn{
    border:1px solid var(--line);
    background: rgba(255,255,255,.06);
    color: var(--txt);
    padding:8px 10px;
    border-radius: 12px;
    font-size:12px;
    cursor:pointer;
    user-select:none;
    transition: transform .12s ease;
  }
  .miniBtn:active{ transform:scale(var(--tap)); }

  /* Device cards (Panel) */
  .deviceCard{
    border:1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.05));
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .deviceCard.active:before{
    content:"";
    position:absolute;
    inset:-2px;
    background:
      radial-gradient(420px 200px at 20% 20%, rgba(122,43,255,.22), transparent 60%),
      radial-gradient(420px 200px at 80% 80%, rgba(43,124,255,.18), transparent 60%);
    filter: blur(10px);
    opacity: .9;
    pointer-events:none;
  }
  .deviceCard > *{ position:relative; z-index:1; }

  .deviceTop{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .deviceName{ font-weight:800; }
  .deviceHint{ font-size:12px; color:var(--muted); margin-top:2px; }
  .deviceState{
    font-size:12px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .pulse{
    width:8px;height:8px;border-radius:99px;background: var(--ok);
    box-shadow: 0 0 16px rgba(55,214,122,.45);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform: scale(1); opacity: .75; }
    50%{ transform: scale(1.35); opacity: 1; }
  }

  .controlRow{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .seg{
    display:inline-flex;
    gap:6px;
    padding:6px;
    border-radius: 999px;
    border:1px solid var(--line);
    background: rgba(255,255,255,.04);
  }
  .seg .miniBtn{ border-radius: 999px; padding:8px 10px; }

  /* Mini status bar */
  .statusBar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    justify-content:space-between;
  }
  .statusLine{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
  }

  /* Bottom nav */
  .nav{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:40;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    backdrop-filter: blur(14px);
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.35));
  }
  body.light .nav{
    background: linear-gradient(180deg, transparent, rgba(255,255,255,.78));
  }
  .navBar{
    border:1px solid var(--line);
    background: rgba(255,255,255,.06);
    border-radius: 22px;
    display:flex;
    overflow:hidden;
    box-shadow: var(--shadow);
  }
  .tab{
    flex:1;
    padding: 10px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color: var(--muted);
    cursor:pointer;
    user-select:none;
    transition: background .18s ease, color .18s ease;
  }
  .tab strong{
    font-size:11px;
    font-weight:700;
    letter-spacing:.02em;
  }
  .tab.active{
    color: var(--txt);
    background:
      radial-gradient(180px 90px at 50% 0%, rgba(122,43,255,.18), transparent 60%),
      radial-gradient(180px 90px at 60% 60%, rgba(43,124,255,.14), transparent 60%),
      rgba(255,255,255,.05);
  }

  /* Modal */
  .modalWrap{
    position:fixed;
    inset:0;
    z-index:60;
    display:none;
    align-items:flex-end;
    background: rgba(0,0,0,.45);
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
  }
  .modalWrap.show{ display:flex; }
  .modal{
    width:100%;
    border-radius: 22px;
    border:1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
    box-shadow: var(--shadow);
    padding: 12px;
  }
  .modalHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
  }
  .modalHeader h3{ margin:0; font-size:14px; }
  .closeX{ font-size:18px; line-height:1; padding:8px 10px; }

  .sp8{ height:8px; }
  .sp12{ height:12px; }
  .sp16{ height:16px; }
</style>
</head>

<body class="safeTop safeBottom">
  <div class="app">
    <div class="topbar">
      <div class="row">
        <div class="brand">
          <div class="logoWrap" title="AURA">
            <!-- Минималистичный логотип (SVG внутри кода) -->
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <defs>
                <linearGradient id="gA" x1="0" x2="1">
                  <stop offset="0%" stop-color="#7A2BFF"/>
                  <stop offset="100%" stop-color="#2B7CFF"/>
                </linearGradient>
              </defs>
              <polygon points="50,10 90,90 75,90 65,70 35,70 25,90 10,90" fill="url(#gA)"/>
            </svg>
          </div>
          <div class="titleWrap">
            <div class="title">AURA</div>
            <div class="subtitle" id="subtitle">Smart Home Center</div>
          </div>
        </div>

        <div class="row">
          <div class="iconBtn" id="themeBtn">🌙 <span class="pill" id="themeLabel">Тёмная</span></div>
          <div class="iconBtn" id="helpBtn">?</div>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="view" id="view"></div>
    </div>

    <div class="nav">
      <div class="navBar">
        <div class="tab active" data-tab="center">🧠<strong>Центр</strong></div>
        <div class="tab" data-tab="panel">🎛<strong>Пульт</strong></div>
        <div class="tab" data-tab="scenes">✨<strong>Сцены</strong></div>
        <div class="tab" data-tab="account">👤<strong>Аккаунт</strong></div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modalWrap" id="modalWrap">
    <div class="modal">
      <div class="modalHeader">
        <h3 id="modalTitle">AURA</h3>
        <div class="miniBtn closeX" id="modalClose">✕</div>
      </div>
      <div class="muted" id="modalBody"></div>
      <div class="sp12"></div>
      <button class="btn secondary" id="modalOk">Ок</button>
    </div>
  </div>

<script>
/* ===================== Telegram ===================== */
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

/* ===================== Storage ===================== */
const KEY = "aura_pro_v1_1";

const DEVICE_REGISTRY = {
  light:      { key:"light",      name:"Свет",         icon:"💡" },
  speaker:    { key:"speaker",    name:"Колонка",      icon:"🔊" },
  climate:    { key:"climate",    name:"Климат",       icon:"🌡" },
  tv:         { key:"tv",         name:"ТВ",           icon:"📺" },
  curtains:   { key:"curtains",   name:"Шторы",        icon:"🪟" },
  sockets:    { key:"sockets",    name:"Розетки",      icon:"🔌" },
  vacuum:     { key:"vacuum",     name:"Пылесос",      icon:"🤖" },
  humidifier: { key:"humidifier", name:"Увлажнитель",  icon:"💧" },
};

const DEFAULT_DEVICE_STATE = {
  light:      { power:false, brightness:50, temp:"warm" },  // temp warm/cool
  speaker:    { playing:false, volume:30, preset:"lofi" },  // preset jazz/lofi/ambient
  climate:    { power:false, temperature:23, mode:"auto" }, // mode auto/heat/cool
  tv:         { power:false, input:"home" },                // input home/youtube/netflix
  curtains:   { open:false },                               
  sockets:    { power:false },
  vacuum:     { running:false, mode:"auto" },               // mode auto/turbo
  humidifier: { power:false, level:2 },                     // level 1-3
};

function nowISO(){
  const d = new Date();
  return d.toISOString();
}
function isNight(){
  const h = new Date().getHours();
  return (h >= 22 || h <= 6);
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);

      // migrations / defaults
      s.theme ??= "dark";
      s.user ??= { role:"owner", name:"", telegramId:null };
      s.system ??= { online:true };
      s.home ??= { available:{} };
      s.devices ??= {};
      s.logs ??= [];
      s.lastCommand ??= "";
      s.scenes ??= [];
      s.lastIntent ??= "";

      // ensure available devices exist (default: true for all on first run)
      if(!s.home.available || Object.keys(s.home.available).length === 0){
        s.home.available = {};
        Object.keys(DEVICE_REGISTRY).forEach(k => s.home.available[k] = true);
      } else {
        Object.keys(DEVICE_REGISTRY).forEach(k => { if(typeof s.home.available[k] !== "boolean") s.home.available[k] = true; });
      }

      // ensure device state objects
      Object.keys(DEVICE_REGISTRY).forEach(k => {
        s.devices[k] = { ...(DEFAULT_DEVICE_STATE[k] || {}), ...(s.devices[k] || {}) };
      });

      return s;
    }
  }catch(e){}
  // new state
  const devices = {};
  Object.keys(DEVICE_REGISTRY).forEach(k => devices[k] = { ...(DEFAULT_DEVICE_STATE[k] || {}) });
  const available = {};
  Object.keys(DEVICE_REGISTRY).forEach(k => available[k] = true);

  return {
    theme:"dark",
    user:{ role:"owner", name:"", telegramId:null },
    system:{ online:true },
    home:{ available },
    devices,
    logs:[],
    lastCommand:"",
    lastIntent:"",
    scenes:[],
  };
}

let state = load();

function save(){
  localStorage.setItem(KEY, JSON.stringify(state));
}

/* ===================== Modal ===================== */
const $ = (q)=>document.querySelector(q);
function showModal(title, bodyHTML){
  $("#modalTitle").textContent = title;
  $("#modalBody").innerHTML = bodyHTML;
  $("#modalWrap").classList.add("show");
}
function hideModal(){ $("#modalWrap").classList.remove("show"); }
$("#modalClose").onclick = hideModal;
$("#modalOk").onclick = hideModal;
$("#modalWrap").addEventListener("click",(e)=>{ if(e.target.id==="modalWrap") hideModal(); });

/* ===================== Theme ===================== */
function applyTheme(){
  document.body.classList.toggle("light", state.theme === "light");
  const isLight = state.theme === "light";
  $("#themeBtn").firstChild.textContent = isLight ? "☀️ " : "🌙 ";
  $("#themeLabel").textContent = isLight ? "Светлая" : "Тёмная";
}
$("#themeBtn").onclick = ()=>{
  state.theme = (state.theme === "dark") ? "light" : "dark";
  save();
  applyTheme();
};
applyTheme();

/* ===================== UX helpers ===================== */
function haptic(type){
  if(!tg) return;
  try{
    if(type === "success") tg.HapticFeedback?.notificationOccurred("success");
    if(type === "warning") tg.HapticFeedback?.notificationOccurred("warning");
    if(type === "error") tg.HapticFeedback?.notificationOccurred("error");
    if(type === "tap") tg.HapticFeedback?.impactOccurred("light");
  }catch(e){}
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    haptic("success");
    showModal("Скопировано", "Команда в буфере. Вставь в Алису или скажи голосом.");
  }catch(e){
    // fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    haptic("success");
    showModal("Скопировано", "Команда в буфере.");
  }
}

function logAction(text){
  const t = new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  state.logs.unshift(`${t} — ${text}`);
  if(state.logs.length > 5) state.logs.pop();
  save();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,"&quot;"); }

/* ===================== Smart Command Engine ===================== */
function getAvailableKeys(){
  return Object.keys(DEVICE_REGISTRY).filter(k => !!state.home.available[k]);
}
function hasDev(key){ return !!state.home.available[key]; }

function intentFromText(text){
  const q = (text || "").toLowerCase().trim();
  // normalize
  const t = q.replace(/\s+/g," ");

  const map = [
    { intent:"cinema",   keys:["кино","фильм","сериал","театр"] },
    { intent:"sleep",    keys:["сон","спать","ночь","уснуть","кровать"] },
    { intent:"work",     keys:["работа","фокус","учёба","дела"] },
    { intent:"guests",   keys:["гости","вечерин","туса","компания"] },
    { intent:"relax",    keys:["релакс","расслаб","спокойно","медитац","йога"] },
    { intent:"cleaning", keys:["уборк","пылесос","чисто"] },
    { intent:"morning",  keys:["утро","доброе","подъём"] },
    { intent:"cozy",     keys:["уют","камин","тепло","атмосфера"] },
    { intent:"music",    keys:["музык","включи музыку","поставь","джаз","лофай","lofi","ambient","фон"] },
    { intent:"lights",   keys:["свет","ламп","ярче","темнее","тёплый","холодный"] },
    { intent:"timer",    keys:["таймер"] },
  ];

  for(const r of map){
    if(r.keys.some(k => t.includes(k))) return r.intent;
  }
  return "auto";
}

function buildCommand(intent, rawText){
  const night = isNight();
  const avail = {
    light: hasDev("light"),
    speaker: hasDev("speaker"),
    climate: hasDev("climate"),
    tv: hasDev("tv"),
    curtains: hasDev("curtains"),
    sockets: hasDev("sockets"),
    vacuum: hasDev("vacuum"),
    humidifier: hasDev("humidifier"),
  };

  const d = state.devices;

  // Helper: include only if makes sense
  const parts = [];

  function add(part){
    if(part) parts.push(part);
  }

  // extract possible minutes from text
  const m = String(rawText || "").match(/(\d{1,3})\s*(мин|мину|minutes|minute|m)\b/i);
  const minutes = m ? Math.max(1, Math.min(180, parseInt(m[1],10))) : null;

  // Music presets by keywords
  const q = (rawText || "").toLowerCase();
  let musicPreset = null;
  if(q.includes("джаз")) musicPreset = "джаз";
  else if(q.includes("лоф") || q.includes("lofi")) musicPreset = "ло-фай";
  else if(q.includes("фон") || q.includes("ambient")) musicPreset = "фоновую";

  // Build by intent
  if(intent === "cinema"){
    add("Алиса, включи режим кино:");
    if(avail.light){
      const target = night ? 15 : 20;
      add(d.light.power ? `приглуши свет до ${target}%.` : `включи свет и приглуши до ${target}%.`);
    }
    if(avail.speaker && d.speaker.playing){
      add("выключи музыку.");
    }
    if(avail.tv){
      add(d.tv.power ? "подготовь ТВ для просмотра." : "включи телевизор.");
    }
    if(!avail.light && !avail.tv){
      add("создай атмосферу кино.");
    }
  }
  else if(intent === "sleep"){
    add("Алиса, режим сон:");
    if(avail.light){
      add(d.light.power ? "сделай тёплый свет 20%." : "включи тёплый свет 20%.");
    }
    if(avail.speaker){
      add(d.speaker.playing ? "сделай музыку тише." : "включи спокойную музыку очень тихо.");
    }
    if(avail.climate){
      add(d.climate.power ? "переведи климат в авто и сделай комфортнее." : "включи климат в авто режим.");
    }
    if(avail.curtains){
      add(d.curtains.open ? "закрой шторы." : "убедись, что шторы закрыты.");
    }
    add("поставь таймер на 45 минут.");
  }
  else if(intent === "work"){
    add("Алиса, режим работа:");
    if(avail.light){
      add(d.light.power ? "сделай яркий холодный свет 80%." : "включи яркий холодный свет 80%.");
    }
    if(avail.speaker){
      add(d.speaker.playing ? "сделай музыку очень тихо." : "включи фоновый ло-фай очень тихо.");
    }
    add("включи режим фокуса.");
  }
  else if(intent === "guests"){
    add("Алиса, режим гости:");
    if(avail.light){
      add(d.light.power ? "сделай тёплый свет 45%." : "включи тёплый свет 45%.");
    }
    if(avail.speaker){
      add(d.speaker.playing ? "сделай музыку чуть громче." : "включи фоновую музыку.");
    }
    if(avail.climate){
      add(d.climate.power ? "поддерживай комфортную температуру." : "включи климат в авто режим.");
    }
  }
  else if(intent === "relax"){
    add("Алиса, режим релакс:");
    if(avail.light){
      add(d.light.power ? "мягкий тёплый свет 30%." : "включи мягкий тёплый свет 30%.");
    }
    if(avail.speaker){
      add(d.speaker.playing ? "сделай музыку тише." : "включи спокойный джаз тихо.");
    }
    add("таймер 40 минут.");
  }
  else if(intent === "cleaning"){
    add("Алиса, режим уборка:");
    if(avail.light){
      add(d.light.power ? "яркий свет 90%." : "включи яркий свет 90%.");
    }
    if(avail.vacuum){
      add(d.vacuum.running ? "увеличь мощность пылесоса." : "запусти пылесос в авто режиме.");
    } else {
      add("включи бодрую музыку.");
    }
    add("таймер 30 минут.");
  }
  else if(intent === "morning"){
    add("Алиса, доброе утро:");
    if(avail.light){
      add(d.light.power ? "плавно увеличь свет до 60%." : "плавно включи свет до 60%.");
    }
    if(avail.speaker){
      add(d.speaker.playing ? "сделай музыку чуть громче." : "включи бодрую музыку тихо.");
    }
    add("скажи погоду и планы на день.");
  }
  else if(intent === "cozy"){
    add("Алиса, уютный режим:");
    if(avail.light){
      add(d.light.power ? "тёплый свет 35%." : "включи тёплый свет 35%.");
    }
    if(avail.speaker){
      add(d.speaker.playing ? "сделай музыку комфортнее." : "включи фоновую музыку.");
    }
    if(avail.humidifier){
      add(d.humidifier.power ? "увеличь увлажнение на уровень 2." : "включи увлажнитель на уровень 2.");
    }
  }
  else if(intent === "music"){
    add("Алиса, музыка:");
    if(avail.speaker){
      if(d.speaker.playing){
        add("переключи трек и сделай комфортную громкость.");
      } else {
        add(`включи ${musicPreset ? musicPreset : "фоновую"} музыку.`);
      }
    } else {
      add("включи музыку на колонке.");
    }
    if(minutes) add(`таймер ${minutes} минут.`);
  }
  else if(intent === "lights"){
    add("Алиса, свет:");
    if(avail.light){
      // Simple heuristic brightness
      let b = null;
      if(q.includes("ярче")) b = 80;
      if(q.includes("темнее")) b = 20;
      if(q.includes("100")) b = 100;
      if(q.includes("60")) b = 60;
      if(q.includes("30")) b = 30;
      if(q.includes("10")) b = 10;

      const temp = (q.includes("холод")) ? "холодный" : (q.includes("тёпл") ? "тёплый" : null);
      if(!d.light.power) add("включи свет.");
      if(temp) add(`сделай ${temp} свет.`);
      if(b !== null) add(`установи яркость ${b}%.`);
      if(!temp && b === null) add(`сделай свет ${night ? "мягким тёплым 25%" : "комфортным 45%"}.`);
    } else {
      add("включи свет.");
    }
  }
  else if(intent === "timer"){
    add("Алиса, таймер:");
    add(`поставь таймер на ${minutes ?? 30} минут.`);
  }
  else {
    // AUTO: best effort based on time and current device states
    add("Алиса, создай приятную атмосферу:");
    if(avail.light){
      const target = night ? 25 : 45;
      add(d.light.power ? `сделай тёплый свет ${target}%.` : `включи тёплый свет ${target}%.`);
    }
    if(avail.speaker){
      if(d.speaker.playing){
        add(`сделай музыку ${night ? "тише" : "комфортнее"}.`);
      } else {
        add(`включи ${night ? "спокойную" : "фоновую"} музыку тихо.`);
      }
    }
    if(avail.climate){
      add(d.climate.power ? "поддерживай комфортную температуру." : "включи климат в авто режим.");
    }
    if(night) add("таймер 45 минут.");
  }

  // join and cleanup punctuation
  let cmd = parts.join(" ");
  cmd = cmd.replace(/\s+/g," ").trim();
  // Ensure ending
  if(!/[.!?]$/.test(cmd)) cmd += ".";
  return cmd;
}

function applySmartSideEffects(intent){
  // Update "virtual device state" so dashboard feels alive
  // We keep it conservative to avoid weirdness.
  const d = state.devices;
  const avail = (k)=>hasDev(k);

  const night = isNight();

  if(intent === "cinema"){
    if(avail("light")){
      d.light.power = true;
      d.light.brightness = night ? 15 : 20;
      d.light.temp = "warm";
    }
    if(avail("speaker")){
      d.speaker.playing = false;
      d.speaker.volume = Math.max(10, d.speaker.volume - 5);
    }
    if(avail("tv")) d.tv.power = true;
  }
  else if(intent === "sleep"){
    if(avail("light")){
      d.light.power = true;
      d.light.brightness = 20;
      d.light.temp = "warm";
    }
    if(avail("speaker")){
      d.speaker.playing = true;
      d.speaker.volume = 15;
      d.speaker.preset = "ambient";
    }
    if(avail("climate")){
      d.climate.power = true;
      d.climate.mode = "auto";
      d.climate.temperature = Math.max(20, Math.min(24, d.climate.temperature));
    }
    if(avail("curtains")) d.curtains.open = false;
  }
  else if(intent === "work"){
    if(avail("light")){
      d.light.power = true;
      d.light.brightness = 80;
      d.light.temp = "cool";
    }
    if(avail("speaker")){
      d.speaker.playing = true;
      d.speaker.volume = 12;
      d.speaker.preset = "lofi";
    }
  }
  else if(intent === "guests"){
    if(avail("light")){
      d.light.power = true;
      d.light.brightness = 45;
      d.light.temp = "warm";
    }
    if(avail("speaker")){
      d.speaker.playing = true;
      d.speaker.volume = 40;
      d.speaker.preset = "ambient";
    }
    if(avail("climate")){
      d.climate.power = true;
      d.climate.mode = "auto";
    }
  }
  else if(intent === "relax"){
    if(avail("light")){
      d.light.power = true;
      d.light.brightness = 30;
      d.light.temp = "warm";
    }
    if(avail("speaker")){
      d.speaker.playing = true;
      d.speaker.volume = 18;
      d.speaker.preset = "jazz";
    }
  }
  else if(intent === "cleaning"){
    if(avail("light")){
      d.light.power = true;
      d.light.brightness = 90;
      d.light.temp = "cool";
    }
    if(avail("vacuum")) d.vacuum.running = true;
    if(avail("speaker")){
      d.speaker.playing = true;
      d.speaker.volume = 35;
      d.speaker.preset = "ambient";
    }
  }
  else if(intent === "music"){
    if(avail("speaker")){
      d.speaker.playing = true;
      d.speaker.volume = Math.max(18, d.speaker.volume);
    }
  }
  else if(intent === "lights"){
    if(avail("light")){
      d.light.power = true;
    }
  }
}

/* ===================== Scenes ===================== */
function saveSceneFromLast(){
  const cmd = (state.lastCommand || "").trim();
  if(!cmd){
    showModal("Нечего сохранять", "Сначала сформируй команду.");
    return;
  }
  const title = guessTitle(cmd);
  state.scenes.unshift({
    id: String(Date.now()) + "_" + Math.random().toString(16).slice(2),
    title,
    command: cmd,
    createdAt: nowISO(),
  });
  save();
  logAction(`Сценарий сохранён: ${title}`);
  haptic("success");
  render();
  showModal("Сохранено", `Сценарий <b>${escapeHtml(title)}</b> добавлен.`);
}

function guessTitle(cmd){
  const c = cmd.toLowerCase();
  if(c.includes("кино")) return "Режим Кино";
  if(c.includes("сон")) return "Режим Сон";
  if(c.includes("работ")) return "Режим Работа";
  if(c.includes("гост")) return "Режим Гости";
  if(c.includes("уборк")) return "Режим Уборка";
  if(c.includes("релакс") || c.includes("джаз")) return "Режим Релакс";
  if(c.includes("уют")) return "Уютный режим";
  return "Сценарий AURA";
}

          </div>
          <div class="seg">
            <div class="miniBtn" data-act="speaker:preset:jazz">Джаз</div>
            <div class="miniBtn" data-act="speaker:preset:lofi">Ло-фай</div>
            <div class="miniBtn" data-act="speaker:preset:ambient">Фон</div>
          </div>
        </div>
      </div>
    `);
  }

  // CLIMATE
  if(hasDev("climate")){
    const active = d.climate.power;
    const st = active ? `${d.climate.temperature}° · ${d.climate.mode}` : "выкл";
    blocks.push(`
      <div class="deviceCard ${active ? "active" : ""}">
        ${cardHeader("climate", st, active)}
        <div class="controlRow">
          <div class="seg">
            <div class="miniBtn" data-act="climate:power:on">Вкл</div>
            <div class="miniBtn" data-act="climate:power:off">Выкл</div>
          </div>
          <div class="seg">
            <div class="miniBtn" data-act="climate:t:-1">-1°</div>
            <div class="miniBtn" data-act="climate:t:+1">+1°</div>
            <div class="miniBtn" data-act="climate:mode:auto">Авто</div>
          </div>
        </div>
      </div>
    `);
  }

  // TV
  if(hasDev("tv")){
    const active = d.tv.power;
    const st = active ? `вкл · ${d.tv.input}` : "выкл";
    blocks.push(`
      <div class="deviceCard ${active ? "active" : ""}">
        ${cardHeader("tv", st, active)}
        <div class="controlRow">
          <div class="seg">
            <div class="miniBtn" data-act="tv:power:on">Вкл</div>
            <div class="miniBtn" data-act="tv:power:off">Выкл</div>
          </div>
          <div class="seg">
            <div class="miniBtn" data-act="tv:input:youtube">YouTube</div>
            <div class="miniBtn" data-act="tv:input:netflix">Netflix</div>
            <div class="miniBtn" data-act="tv:input:home">Дом</div>
          </div>
        </div>
      </div>
    `);
  }

  // CURTAINS
  if(hasDev("curtains")){
    const active = d.curtains.open; // open == active visual
    const st = active ? "открыты" : "закрыты";
    blocks.push(`
      <div class="deviceCard ${active ? "active" : ""}">
        ${cardHeader("curtains", st, active)}
        <div class="controlRow">
          <div class="seg">
            <div class="miniBtn" data-act="curtains:open">Открыть</div>
            <div class="miniBtn" data-act="curtains:close">Закрыть</div>
          </div>
        </div>
      </div>
    `);
  }

  // SOCKETS
  if(hasDev("sockets")){
    const active = d.sockets.power;
    const st = active ? "вкл" : "выкл";
    blocks.push(`
      <div class="deviceCard ${active ? "active" : ""}">
        ${cardHeader("sockets", st, active)}
        <div class="controlRow">
          <div class="seg">
            <div class="miniBtn" data-act="sockets:power:on">Вкл</div>
            <div class="miniBtn" data-act="sockets:power:off">Выкл</div>
          </div>
        </div>
      </div>
    `);
  }

  // VACUUM
  if(hasDev("vacuum")){
    const active = d.vacuum.running;
    const st = active ? `работает · ${d.vacuum.mode}` : "остановлен";
    blocks.push(`
      <div class="deviceCard ${active ? "active" : ""}">
        ${cardHeader("vacuum", st, active)}
        <div class="controlRow">
          <div class="seg">
            <div class="miniBtn" data-act="vacuum:start">Старт</div>
            <div class="miniBtn" data-act="vacuum:stop">Стоп</div>
          </div>
          <div class="seg">
            <div class="miniBtn" data-act="vacuum:mode:auto">Авто</div>
            <div class="miniBtn" data-act="vacuum:mode:turbo">Турбо</div>
          </div>
        </div>
      </div>
    `);
  }

  // HUMIDIFIER
  if(hasDev("humidifier")){
    const active = d.humidifier.power;
    const st = active ? `вкл · уровень ${d.humidifier.level}` : "выкл";
    blocks.push(`
      <div class="deviceCard ${active ? "active" : ""}">
        ${cardHeader("humidifier", st, active)}
        <div class="controlRow">
          <div class="seg">
            <div class="miniBtn" data-act="humidifier:power:on">Вкл</div>
            <div class="miniBtn" data-act="humidifier:power:off">Выкл</div>
          </div>
          <div class="seg">
            <div class="miniBtn" data-act="humidifier:level:1">1</div>
            <div class="miniBtn" data-act="humidifier:level:2">2</div>
            <div class="miniBtn" data-act="humidifier:level:3">3</div>
          </div>
        </div>
      </div>
    `);
  }

  return `
    <div class="card glowBorder">
      <div class="h1">Командный пульт</div>
      <div class="muted">Кнопки меняют “виртуальное” состояние и создают команду, которую можно скопировать для Алисы.</div>
      <div class="sp12"></div>
      ${blocks.join('<div class="sp12"></div>')}
    </div>
  `;
}

function renderScenes(){
  setSubtitle("Сцены");
  const list = state.scenes.length
    ? state.scenes.map(s=>`
      <div class="item">
        <div class="itemTop">
          <div>
            <div class="itemTitle">${escapeHtml(s.title)}</div>
            <div class="itemMeta">${new Date(s.createdAt).toLocaleString("ru-RU")}</div>
          </div>
          <div class="row" style="gap:8px;">
            <div class="miniBtn" data-scopy="${s.id}">Скопировать</div>
            <div class="miniBtn" data-sdel="${s.id}">Удалить</div>
          </div>
        </div>
        <div class="sp8"></div>
        <div class="muted">${escapeHtml(s.command)}</div>
      </div>
    `).join("")
    : `<div class="muted">Пока нет сцен. Сформируй команду в “Центре” и нажми “Сохранить”.</div>`;

  return `
    <div class="card glowBorder">
      <div class="h1">Мои сцены</div>
      <div class="muted">Сохраняй лучшие режимы и используй в один тап.</div>
      <div class="sp12"></div>
      <button class="btn secondary" id="exportBtn">Экспорт (скопировать все)</button>
      <div class="sp12"></div>
      <div class="list" id="sceneList">${list}</div>
    </div>
  `;
}

function renderAccount(){
  setSubtitle("Аккаунт");

  // auto-fill from Telegram
  if(tg && tg.initDataUnsafe?.user){
    state.user.name = state.user.name || tg.initDataUnsafe.user.first_name || "";
    state.user.telegramId = state.user.telegramId || tg.initDataUnsafe.user.id || null;
    save();
  }

  const ua = navigator.userAgent || "";
  const deviceLine = ua.includes("iPhone") ? "iPhone" : "Устройство";
  const role = state.user.role || "owner";

  const keys = Object.keys(DEVICE_REGISTRY);
  const toggles = keys.map(k=>{
    const v = !!state.home.available[k];
    const meta = DEVICE_REGISTRY[k];
    return `
      <div class="chip" data-toggle="${k}">
        <div>
          <b>${meta.icon} ${escapeHtml(meta.name)}</b>
          <small>${v ? "Есть дома" : "Нет"}</small>
        </div>
        <span class="pill" style="color:${v ? "var(--ok)" : "var(--muted)"}">${v ? "ON" : "OFF"}</span>
      </div>
    `;
  }).join("");

  return `
    <div class="card glowBorder">
      <div class="h1">Профиль</div>
      <div class="muted">Данные хранятся локально на телефоне.</div>
      <div class="sp12"></div>

      <span class="badge"><span class="dot ok"></span>Роль: ${escapeHtml(role)}</span>
      <div class="sp12"></div>

      <div class="muted"><b>Имя:</b> ${escapeHtml(state.user.name || "Гость")}</div>
      <div class="muted"><b>Telegram ID:</b> ${state.user.telegramId ? escapeHtml(String(state.user.telegramId)) : "—"}</div>
      <div class="muted"><b>${escapeHtml(deviceLine)}:</b> ${escapeHtml(ua)}</div>

      <div class="sp12"></div>
      <button class="btn secondary" id="resetBtn">Сбросить приложение</button>
    </div>

    <div class="sp12"></div>

    <div class="card">
      <div class="h1">Устройства дома</div>
      <div class="muted">Отметь, что реально есть — “Пульт” и команды подстроятся.</div>
      <div class="sp12"></div>
      <div class="grid2" id="toggles">${toggles}</div>
    </div>
  `;
}

/* ===================== Actions ===================== */
function generateFromText(text){
  const intent = intentFromText(text);
  state.lastIntent = intent;

  const cmd = buildCommand(intent, text);
  state.lastCommand = cmd;

  // animate + make device state feel real
  applySmartSideEffects(intent);

  save();
  logAction(`Команда: ${cmd}`);
  haptic("tap");
  render();
}

function boostLast(){
  // "Smart boost": based on intent & time
  const intent = state.lastIntent || "auto";
  const night = isNight();

  // Add a context-aware extra sentence (not too long)
  let extra = "";
  if(intent === "cinema") extra = night ? " И сделай уведомления тише." : " И приглуши уведомления.";
  else if(intent === "sleep") extra = " И поставь мягкий таймер на 60 минут.";
  else if(intent === "work") extra = " И поставь таймер фокуса на 50 минут.";
  else if(intent === "guests") extra = " И сделай громкость комфортной.";
  else if(intent === "relax") extra = " И добавь таймер 45 минут.";
  else if(intent === "cleaning") extra = " И напомни проветрить через 20 минут.";
  else extra = night ? " И поставь таймер 45 минут." : " И добавь таймер 30 минут.";

  if(!state.lastCommand) return;
  if(state.lastCommand.includes(extra.trim())) return;

  state.lastCommand = state.lastCommand.replace(/\.\s*$/,"") + extra + ".";
  save();
  logAction("Усиление команды");
  haptic("success");
  render();
}

function repeatLast(){
  if(!state.lastCommand){
    haptic("warning");
    showModal("Нечего повторять", "Сначала сформируй команду.");
    return;
  }
  logAction("Повтор команды");
  haptic("tap");
  render();
  showModal("Повтор", "Команда отмечена в ленте. Скопируй её и повтори в Алисе.");
}

function applyDeviceAction(act){
  // act format examples:
  // light:power:on, light:br:30, speaker:play, speaker:vol:+10, climate:t:+1, vacuum:mode:turbo
  const parts = String(act).split(":");
  const dev = parts[0];
  const cmd = parts[1];
  const val = parts[2];

  const d = state.devices;
  if(!d[dev]) return;

  if(dev === "light"){
    if(cmd === "power"){
      d.light.power = (val === "on");
      if(d.light.power && d.light.brightness < 10) d.light.brightness = 30;
    }
    if(cmd === "br"){
      d.light.power = true;
      d.light.brightness = Math.max(1, Math.min(100, parseInt(val,10)));
    }
    if(cmd === "temp"){
      d.light.power = true;
      d.light.temp = (val === "cool") ? "cool" : "warm";
    }
    state.lastCommand = buildCommand("lights", `свет ${d.light.temp === "warm" ? "тёплый" : "холодный"} ${d.light.brightness}`);
  }

  if(dev === "speaker"){
    if(cmd === "play"){ d.speaker.playing = true; }
    if(cmd === "pause"){ d.speaker.playing = false; }
    if(cmd === "vol"){
      d.speaker.volume = Math.max(0, Math.min(100, d.speaker.volume + (val.startsWith("+") ? 10 : -10)));
      d.speaker.playing = true;
    }
    if(cmd === "preset"){
      d.speaker.preset = val;
      d.speaker.playing = true;
    }
    state.lastCommand = buildCommand("music", `музыка ${d.speaker.preset} ${d.speaker.volume}`);
  }

  if(dev === "climate"){
    if(cmd === "power"){ d.climate.power = (val === "on"); }
    if(cmd === "t"){
      d.climate.power = true;
      d.climate.temperature = Math.max(16, Math.min(30, d.climate.temperature + (val.startsWith("+") ? 1 : -1)));
    }
    if(cmd === "mode"){
      d.climate.power = true;
      d.climate.mode = val;
    }
    state.lastCommand = buildCommand("auto", "комфорт");
  }

  if(dev === "tv"){
    if(cmd === "power"){ d.tv.power = (val === "on"); }
    if(cmd === "input"){ d.tv.power = true; d.tv.input = val; }
    state.lastCommand = buildCommand("cinema", "кино");
  }

  if(dev === "curtains"){
    if(cmd === "open"){ d.curtains.open = true; }
    if(cmd === "close"){ d.curtains.open = false; }
    state.lastCommand = `Алиса, ${d.curtains.open ? "открой" : "закрой"} шторы.`;
  }

  if(dev === "sockets"){
    if(cmd === "power"){ d.sockets.power = (val === "on"); }
    state.lastCommand = `Алиса, ${d.sockets.power ? "включи" : "выключи"} розетки.`;
  }

  if(dev === "vacuum"){
    if(cmd === "start"){ d.vacuum.running = true; }
    if(cmd === "stop"){ d.vacuum.running = false; }
    if(cmd === "mode"){ d.vacuum.mode = val; d.vacuum.running = true; }
    state.lastCommand = buildCommand("cleaning", "уборка");
  }

  if(dev === "humidifier"){
    if(cmd === "power"){ d.humidifier.power = (val === "on"); }
    if(cmd === "level"){ d.humidifier.power = true; d.humidifier.level = Math.max(1, Math.min(3, parseInt(val,10))); }
    state.lastCommand = buildCommand("cozy", "уют");
  }

  save();
  logAction(`Пульт: ${DEVICE_REGISTRY[dev].name}`);
  haptic("tap");
  render();
}

/* ===================== Wire UI after render ===================== */
function bindCenter(){
  const genBtn = document.getElementById("genBtn");
  const q = document.getElementById("q");
  if(genBtn && q){
    genBtn.onclick = ()=> generateFromText(q.value);
    document.querySelectorAll(".kbtn").forEach(b=>{
      b.onclick = ()=>{
        q.value = b.dataset.p;
        generateFromText(q.value);
      };
    });
  }

  const copyBtn = document.getElementById("copyBtn");
  if(copyBtn) copyBtn.onclick = ()=> copyText(state.lastCommand);

  const saveBtn = document.getElementById("saveBtn");
  if(saveBtn) saveBtn.onclick = ()=> saveSceneFromLast();

  const repeatBtn = document.getElementById("repeatBtn");
  if(repeatBtn) repeatBtn.onclick = ()=> repeatLast();

  const boostBtn = document.getElementById("boostBtn");
  if(boostBtn) boostBtn.onclick = ()=> boostLast();
}

function bindPanel(){
  document.querySelectorAll("[data-act]").forEach(el=>{
    el.onclick = ()=> applyDeviceAction(el.getAttribute("data-act"));
  });
}

function bindScenes(){
  const exportBtn = document.getElementById("exportBtn");
  if(exportBtn){
    exportBtn.onclick = ()=>{
      if(!state.scenes.length){
        showModal("Экспорт", "Сцен нет 🙂");
        return;
      }
      const txt = state.scenes.map(s=>`• ${s.title}\n${s.command}\n`).join("\n");
      copyText(txt);
    };
  }
  document.querySelectorAll("[data-scopy]").forEach(el=>{
    el.onclick = ()=>{
      const id = el.getAttribute("data-scopy");
      const sc = state.scenes.find(x=>x.id===id);
      if(sc) copyText(sc.command);
    };
  });
  document.querySelectorAll("[data-sdel]").forEach(el=>{
    el.onclick = ()=>{
      const id = el.getAttribute("data-sdel");
      state.scenes = state.scenes.filter(x=>x.id!==id);
      save();
      logAction("Сцена удалена");
      render();
    };
  });
}

function bindAccount(){
  const resetBtn = document.getElementById("resetBtn");
  if(resetBtn){
    resetBtn.onclick = ()=>{
      showModal("Сброс", `
        Это удалит настройки и сцены на этом телефоне.<br><br>
        <button class="btn" id="doReset" style="margin-top:10px;">Да, сбросить</button>
      `);
      setTimeout(()=>{
        const b = document.getElementById("doReset");
        if(b){
          b.onclick = ()=>{
            localStorage.removeItem(KEY);
            location.reload();
          };
        }
      }, 50);
    };
  }

  document.querySelectorAll("[data-toggle]").forEach(el=>{
    el.onclick = ()=>{
      const k = el.getAttribute("data-toggle");
      state.home.available[k] = !state.home.available[k];
      save();
      logAction(`Устройство: ${DEVICE_REGISTRY[k].name} = ${state.home.available[k] ? "ON" : "OFF"}`);
      haptic("tap");
      render();
    };
  });
}

/* ===================== Render ===================== */
function render(){
  // update user info if Telegram provides
  if(tg && tg.initDataUnsafe?.user){
    state.user.name = state.user.name || tg.initDataUnsafe.user.first_name || "";
    state.user.telegramId = state.user.telegramId || tg.initDataUnsafe.user.id || null;
    save();
  }

  let html = "";
  if(currentTab === "center") html = renderCenter();
  if(currentTab === "panel")  html = renderPanel();
  if(currentTab === "scenes") html = renderScenes();
  if(currentTab === "account") html = renderAccount();

  renderWithTransition(html);

  // bind after DOM update
  setTimeout(()=>{
    if(currentTab === "center") bindCenter();
    if(currentTab === "panel") bindPanel();
    if(currentTab === "scenes") bindScenes();
    if(currentTab === "account") bindAccount();
  }, 0);
}

render();
</script>
