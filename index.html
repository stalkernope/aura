<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AURA X</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">

  <style>
    :root{
      --bg: #0F1115;
      --bg-elev: #151821;
      --card: #1B1F2A;
      --card-2:#202535;
      --line: rgba(255,255,255,.06);
      --txt: #F2F4F8;
      --muted: #9AA3B2;
      --accent: #5E8BFF;
      --accent-soft: rgba(94,139,255,.15);
      --ok:#34C759;
      --warn:#FF9F0A;
      --danger:#FF453A;
      --radius:18px;
      --shadow: 0 20px 50px rgba(0,0,0,.45);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background: var(--bg);
      color: var(--txt);
      -webkit-font-smoothing: antialiased;
    }

    .app{
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    .topbar{
      padding: 16px 16px 10px;
      padding-top: calc(16px + env(safe-area-inset-top));
      background: linear-gradient(180deg, #12141B, transparent);
      position:sticky;
      top:0;
      z-index:10;
    }

    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .title{
      font-size:20px;
      font-weight:800;
      letter-spacing:.02em;
    }

    .subtitle{
      font-size:13px;
      color:var(--muted);
      margin-top:2px;
    }

    .content{
      flex:1;
      padding: 10px 16px 100px;
    }

    .section{
      margin-top:22px;
    }

    .section h3{
      margin:0 0 10px;
      font-size:15px;
      color:var(--muted);
      font-weight:600;
    }

    .card{
      background: var(--card);
      border-radius: var(--radius);
      padding:16px;
      box-shadow: var(--shadow);
      border:1px solid var(--line);
    }

    .card + .card{
      margin-top:12px;
    }

    .status-pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      background: var(--card-2);
      color:var(--muted);
    }

    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background: var(--ok);
    }

    .grid-rooms{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }

    .room-card{
      background: var(--card-2);
      border-radius:16px;
      padding:14px;
      border:1px solid var(--line);
      transition:.2s;
    }

    .room-card:active{
      transform:scale(.97);
    }

    .room-title{
      font-weight:600;
      font-size:14px;
    }

    .room-meta{
      font-size:12px;
      color:var(--muted);
      margin-top:4px;
    }

    .device-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:10px;
      font-size:14px;
    }

    .device-on{
      color:var(--ok);
    }

    .device-off{
      color:var(--muted);
    }

    .nav{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      padding:10px 16px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, transparent, #11141C);
    }

    .nav-inner{
      background: var(--card);
      border-radius:22px;
      display:flex;
      overflow:hidden;
      border:1px solid var(--line);
    }

    .tab{
      flex:1;
      padding:12px 0;
      text-align:center;
      font-size:12px;
      color:var(--muted);
    }

    .tab.active{
      color:var(--accent);
      font-weight:600;
      background: var(--accent-soft);
    }

    /* AI bottom sheet */

    .ai-fab{
      position:fixed;
      bottom:110px;
      right:20px;
      width:56px;
      height:56px;
      border-radius:50%;
      background: var(--accent);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      color:white;
      box-shadow:0 12px 30px rgba(94,139,255,.4);
      cursor:pointer;
    }

    .ai-sheet{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      background: var(--card);
      border-top-left-radius:24px;
      border-top-right-radius:24px;
      padding:20px 16px 40px;
      box-shadow:0 -10px 40px rgba(0,0,0,.6);
      transform:translateY(100%);
      transition:.3s;
      z-index:50;
    }

    .ai-sheet.open{
      transform:translateY(0);
    }

    .ai-input{
      width:100%;
      background: var(--card-2);
      border:none;
      border-radius:14px;
      padding:14px;
      color:white;
      font-size:14px;
      outline:none;
      margin-top:10px;
    }

    .ai-btn{
      margin-top:10px;
      width:100%;
      padding:12px;
      border-radius:14px;
      background: var(--accent);
      color:white;
      border:none;
      font-weight:600;
    }

    .plan-box{
      margin-top:12px;
      background: var(--card-2);
      border-radius:14px;
      padding:12px;
      font-size:13px;
    }
  </style>
</head>

<body>
<div class="app">
  <div class="topbar">
    <div class="row">
      <div>
        <div class="title">AURA X</div>
        <div class="subtitle" id="subtitle">Мой дом</div>
      </div>
      <div class="status-pill">
        <div class="dot"></div>
        Всё спокойно
      </div>
    </div>
  </div>

  <div class="content" id="app"></div>

  <div class="nav">
    <div class="nav-inner" id="tabs"></div>
  </div>
</div>

<div class="ai-fab" id="aiFab">🧠</div>

<div class="ai-sheet" id="aiSheet">
  <h3>AI Центр</h3>
  <input class="ai-input" id="aiInput" placeholder="Например: уютный вечер" />
  <button class="ai-btn" id="aiGenerate">Сформировать</button>
  <div class="plan-box" id="planBox"></div>
</div>

<script src="core.js"></script>
<script src="ai.js"></script>
<script src="ui.js"></script>

</body>
</html>
